.choice.talent-c{border-style:dashed}

.stagedots{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}

/* ---------- планирование ---------- */
.tabs{display:flex;gap:6px;padding:6px;background:var(--surface);border:2px solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--edge)}
.tab{flex:1;min-height:46px;padding:0 12px;border:0;border-radius:12px;background:transparent;font:700 15.5px var(--font-body);color:var(--ink-2);transition:background var(--d-base),color var(--d-base),transform var(--d-fast);display:flex;align-items:center;justify-content:center;gap:8px}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--ground)}
.tab:active{transform:scale(.97)}
.plan{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:start}
.plan-main{display:grid;gap:16px;min-width:0}
.plan-side{display:grid;gap:16px;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 190px)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{display:grid;gap:2px;padding:10px 12px;min-height:64px;border-radius:14px;border:2px solid var(--edge-strong);background:var(--surface);text-align:left;box-shadow:0 3px 0 var(--edge-strong);transition:transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast),background var(--d-base)}
.seg button b{font:700 15.5px var(--font-body)} .seg button span{font-size:13px;color:var(--ink-2)}
.seg button[aria-checked="true"]{background:var(--brand);border-color:var(--brand-edge);box-shadow:0 3px 0 var(--brand-edge);color:var(--on-brand)}
.seg button[aria-checked="true"] span{color:var(--on-brand)}
.seg button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge-strong)}
.pcard{display:grid;gap:14px;padding:16px 18px 18px}
.pcard-top{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(110px,170px);gap:14px;align-items:center}
.pcard-art{width:56px;height:56px;border-radius:16px;background:var(--surface-2);border:2px solid var(--edge);display:grid;place-items:center;box-shadow:0 3px 0 var(--edge)}
.pcard h3{font-size:18px}
.pcard-sub{font-size:13.5px;color:var(--muted);margin-top:2px}
.ctls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.ctl{min-width:0}
.ctl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.ctl-head label{font:600 14px var(--font-body);color:var(--ink-2)}
.ctl-val{font:800 21px var(--font-display);white-space:nowrap}
.ctl-row{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px;align-items:center}
.step-btn{width:44px;height:44px;border-radius:12px;border:2px solid var(--edge-strong);background:var(--surface);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--edge-strong);transition:transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast)}
.step-btn:hover{background:var(--surface-2)} .step-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge-strong)}
.step-btn[disabled]{opacity:.4;cursor:not-allowed}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:99px;background:repeating-linear-gradient(90deg,var(--surface-3) 0 8px,var(--surface-2) 8px 10px);border:2px solid var(--edge-strong)}
input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:repeating-linear-gradient(90deg,var(--surface-3) 0 8px,var(--surface-2) 8px 10px);border:2px solid var(--edge-strong)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-10px;border-radius:50%;background:var(--brand);border:3px solid var(--brand-edge);box-shadow:0 3px 0 var(--brand-edge),inset 0 2px 0 rgba(255,255,255,.45)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--brand);border:3px solid var(--brand-edge);box-shadow:0 3px 0 var(--brand-edge)}
input[type=range]:focus-visible{outline-offset:2px}
.scale{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.pstat{padding:8px 12px;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--edge);min-width:0}
.pstat b{display:block;font:600 11.5px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pstat span{font:800 16px var(--font-display);display:block;overflow-wrap:anywhere}
.lockrow{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--warn-fg);font-weight:600}
.pcard.locked{opacity:.6}
.pcard.locked .pcard-art{filter:grayscale(1)}
.hours{display:grid;gap:8px}
.hbar{display:flex;height:22px;border-radius:99px;overflow:hidden;background:var(--surface-3);border:2px solid var(--edge-strong)}
.hbar i{display:block;height:100%;min-width:0;transition:width var(--d-base) var(--ease-out);border-right:2px solid var(--surface)}
.hbar i:last-child{border-right:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend em{width:12px;height:12px;border-radius:4px;display:inline-block;font-style:normal}
.workshop{display:block;width:100%;height:auto}
.ws-wrap{width:100%;max-width:880px;margin-inline:auto;border-radius:16px;overflow:hidden;border:2px solid var(--edge);background:var(--surface-2)}
.ws-card .ws-wrap{max-width:none}
.farm{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px 4px;align-items:end;padding:12px 10px 6px;border-radius:16px;background:var(--surface-2);border:2px solid var(--edge);position:relative}
.farm::after{content:"";position:absolute;left:8px;right:8px;bottom:26px;height:6px;border-radius:99px;background:var(--edge)}
.farm .printer{width:100%;height:auto;position:relative;z-index:1}
.farm figure{margin:0;display:grid;justify-items:center;gap:2px;position:relative;z-index:1}
.farm figcaption{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.2}
.forecast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fbox{padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1.5px solid var(--edge);min-width:0}
.fbox b{display:block;font:600 11.5px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fbox span{display:block;font:800 18px var(--font-display);overflow-wrap:anywhere}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.actionbar-in{pointer-events:auto;max-width:1180px;margin-inline:auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:2px solid var(--edge-strong);border-radius:20px;box-shadow:0 4px 0 var(--edge-strong),0 20px 36px -12px rgba(var(--ink-rgb),.5);padding:10px 12px 10px 18px}
.sum{display:grid;gap:2px;font-size:13.5px;color:var(--ink-2);min-width:0}
.sum b{font:800 17px var(--font-display);color:var(--ink)}

/* ---------- мастерская и финансы ---------- */
.grid-auto{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.upg{display:grid;gap:12px;align-content:space-between}
.upg.owned{background:var(--gain-bg)}
.upg.off{opacity:.6}
.upg .art{width:96px;height:80px;flex:none}
.upg .art.avatar{width:64px;height:64px}
.upg header{display:flex;gap:12px;align-items:center}
.bal{width:100%;border-collapse:collapse}
.bal td{padding:8px 0;border-bottom:1.5px dashed var(--edge)}
.bal td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bal tr.total td{border-bottom:0;border-top:2px solid var(--edge-strong);padding-top:12px;font:800 18px var(--font-display)}
.bigv{font:800 28px/1.1 var(--font-display)}
.mv{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- печать месяца ---------- */
.run{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;justify-items:center;text-align:center}
.run .farm{width:100%;max-width:880px;grid-template-columns:repeat(auto-fit,minmax(150px,190px));justify-content:center;padding:18px 12px 8px}
.runfact{max-width:62ch;margin:0}
.run-bar{width:100%;max-width:880px}
.run-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:880px}
.run-weeks{display:flex;gap:8px;width:100%;max-width:880px;justify-content:space-between}
.run-weeks span{flex:1;white-space:nowrap;text-align:center;padding:6px 10px;border-radius:99px;font:600 13.5px var(--font-body);background:var(--surface-2);border:1.5px solid var(--edge);color:var(--muted);transition:background var(--d-base),color var(--d-base)}
.run-weeks span.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand-edge)}

/* ---------- итоги ---------- */
.profit{font:900 clamp(34px,6vw,60px)/1 var(--font-display)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.wf{display:grid;gap:10px}
.wf-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:15px}
.wf-row .bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.wf-row .bar i{display:block;height:100%;border-radius:99px;background:var(--ink-2);transform-origin:left;animation:grow var(--d-enter) var(--ease-out) both;animation-delay:calc(var(--i,0)*50ms)}
.wf-row.plus .bar i{background:var(--layer-gain)} .wf-row.minus .bar i{background:var(--loss-fg)}
.wf-row.sum{border-top:2px solid var(--edge-strong);padding-top:12px;font-weight:800}
.prows{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:44px minmax(0,1.3fr) repeat(4,minmax(0,.7fr));gap:8px 12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1.5px solid var(--edge);font-size:14.5px}
.ph{display:contents}
.prow .k{font-size:11.5px;color:var(--muted);display:block;letter-spacing:.05em;text-transform:uppercase}
.prow b{font-variant-numeric:tabular-nums}
.tower-wrap{display:grid;place-items:center}
.tower{width:100%;max-width:420px;height:auto}
.tower .t-lab,.capchart .c-lab{font:500 11px var(--font-body);fill:var(--muted)}
.capchart .c-goal{fill:var(--brand-text);font-weight:700}
.capchart{width:100%;height:auto}
.t-new rect{transform-box:fill-box;transform-origin:center;animation:layer-print 900ms var(--ease-out) both}
.t-new{animation:fade-in 300ms ease both}

/* ---------- викторина ---------- */
.qopts{display:grid;gap:12px;margin-top:16px}
.qopt{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;min-height:56px;border-radius:16px;border:2px solid var(--edge-strong);background:var(--surface);box-shadow:0 4px 0 var(--edge-strong);font-weight:600;transition:transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast),background var(--d-base)}
.qopt .k{flex:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--edge-strong);display:grid;place-items:center;font:800 14px var(--font-display);background:var(--surface-2)}
.qopt:hover{background:var(--surface-2);transform:translateY(-2px)}
.qopt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge-strong)}
.qopt.right{background:var(--gain-bg);border-color:var(--gain-fg);color:var(--gain-fg);box-shadow:0 4px 0 var(--gain-fg);animation:pop var(--d-enter) var(--ease-spring)}
.qopt.wrong{background:var(--loss-bg);border-color:var(--loss-fg);color:var(--loss-fg);box-shadow:0 4px 0 var(--loss-fg);animation:shake 360ms var(--ease-out)}
.qopt.dim{opacity:.55;pointer-events:none}
.qprog{display:flex;gap:6px}
.qprog i{flex:1;height:10px;border-radius:99px;background:var(--surface-3);border:1.5px solid var(--edge-strong)}
.qprog i.on{background:var(--brand);border-color:var(--brand-edge)}

/* ---------- финал ---------- */
.final-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:24px;align-items:center}
.rank{font:900 clamp(34px,5.4vw,60px)/1 var(--font-display);color:var(--brand-text)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.bdg{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;border:2px solid var(--edge);background:var(--surface-2)}
.bdg .ico{width:28px;height:28px}
.bdg.on{background:var(--brand);border-color:var(--brand-edge);color:var(--on-brand)}
.bdg.off{opacity:.62}
.bdg small{display:block;font-size:13px;line-height:1.3;opacity:.92}
.epi{display:grid;gap:14px}

/* ---------- мини-игра калибровки ---------- */
.calib{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.calib #calibart svg{width:100%;height:auto;border-radius:16px;background:var(--surface-2);border:2px solid var(--edge)}
.meter{height:22px;border-radius:99px;background:var(--surface-3);border:2px solid var(--edge-strong);overflow:hidden}
.meter i{display:block;height:100%;background:var(--loss-fg);transition:width 120ms linear,background var(--d-base)}
.meter.good i{background:var(--layer-gain)} .meter.mid i{background:var(--p-nozzle)}

/* ---------- отзывы покупателей ---------- */
.rv-list{display:grid;gap:12px}
.rv{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;animation:rise var(--d-enter) var(--ease-out) both;animation-delay:calc(var(--i,0)*120ms + 150ms)}
.rv-av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 19px var(--font-display);border:2px solid var(--edge-strong);background:var(--surface-3);color:var(--ink)}
.rv-av.c-cyan{background:color-mix(in srgb,var(--c-cyan) 22%,var(--surface));border-color:var(--c-cyan);color:var(--c-cyan-text)}
.rv-av.c-orange{background:color-mix(in srgb,var(--c-orange) 22%,var(--surface));border-color:var(--c-orange);color:var(--c-orange-text)}
.rv-av.c-magenta{background:color-mix(in srgb,var(--c-magenta) 22%,var(--surface));border-color:var(--c-magenta);color:var(--c-magenta-text)}
.rv-av.c-lime{background:color-mix(in srgb,var(--c-lime) 22%,var(--surface));border-color:var(--c-lime);color:var(--c-lime-text)}
.rv-av.c-violet{background:color-mix(in srgb,var(--c-violet) 22%,var(--surface));border-color:var(--c-violet);color:var(--c-violet-text)}
.rv-body{background:var(--surface-2);border:1.5px solid var(--edge);border-radius:6px 16px 16px 16px;padding:10px 14px;min-width:0}
.rv-body p{margin:4px 0 0;color:var(--ink-2);font-size:15.5px}
.rv-head{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
.rv-head b{font-weight:700}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars .st{width:15px;height:15px}
.stars .st.on{fill:var(--c-orange)}
.stars .st.off{fill:var(--edge-strong);opacity:.45}
.chip.brand .stars .st.on{fill:var(--on-brand)}
.chip.brand .stars .st.off{fill:var(--on-brand);opacity:.3}

/* ---------- контроль качества ---------- */
.qcbox{position:relative;display:grid;justify-items:center;gap:8px;padding:16px;border-radius:20px;background:var(--surface-2);border:3px solid var(--edge);transition:border-color var(--d-fast)}
.qcbox.ok{border-color:var(--gain-fg)}.qcbox.bad{border-color:var(--loss-fg);animation:shake .4s}
.qcitem{width:min(100%,280px);height:auto}
.qcfb{margin:0;font-weight:700;text-align:center}
.qctimer{width:min(100%,280px);height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.qctimer i{display:block;height:100%;background:var(--brand);transform-origin:left;animation:qctime 2.3s linear forwards}
@keyframes qctime{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.qcbtns{justify-content:center;gap:16px}
.btn.big{min-height:64px;min-width:150px;font-size:19px}
.btn.danger{border-color:var(--loss-fg);box-shadow:0 4px 0 var(--loss-fg);color:var(--loss-fg)}

/* ---------- табло класса ---------- */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.pod{display:grid;gap:2px;justify-items:center;text-align:center;padding:14px 8px;border-radius:16px;border:2px solid var(--edge-strong);background:var(--surface-2);box-shadow:0 4px 0 var(--edge-strong)}
.pod b{font:900 28px var(--font-display);color:var(--brand-text)}.pod small{font-weight:700}
.pod.p1{background:var(--brand);border-color:var(--brand-edge);color:var(--on-brand);padding-block:26px}.pod.p1 b{color:var(--on-brand)}
.board{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center}
.bn{font:800 16px var(--font-display);color:var(--muted);text-align:center}
.bw{position:relative;display:grid;padding:6px 10px;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--edge);overflow:hidden;min-width:0}
.bw>*{position:relative;z-index:1}.bw small{color:var(--ink-2);font-size:12.5px}
.bw i{position:absolute;left:0;top:0;bottom:0;z-index:0;background:color-mix(in srgb,var(--brand) 28%,transparent)}
.bv{font:800 15px var(--font-display);white-space:nowrap}

/* ---------- окна и тосты ---------- */
.modal{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:16px;animation:fade-in var(--d-base) ease both}
.modal-box{width:min(720px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:2px solid var(--edge-strong);border-radius:24px;box-shadow:0 8px 0 var(--edge-strong),0 30px 60px -20px rgba(0,0,0,.6);padding:22px;display:grid;gap:16px;animation:rise var(--d-enter) var(--ease-out) both}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.terms{display:grid;gap:10px}
.termc{padding:12px 16px;border-radius:14px;background:var(--surface-2);border:1.5px solid var(--edge)}
.termc b{display:block;font-family:var(--font-display)}
.termc span{color:var(--ink-2);font-size:15px}
.termc.empty{display:flex;gap:10px;align-items:center;color:var(--ink-2)}
.locks{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.locks i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);border:1.5px dashed var(--edge-strong);color:var(--muted)}
.locks i .ico{width:16px;height:16px}
.locks-t{flex-basis:100%;margin:0;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 12px 30px -8px rgba(0,0,0,.5);animation:toast-in var(--d-enter) var(--ease-spring) both}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

/* ---------- анимации ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,14px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes blink{to{visibility:hidden}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes flag-up{from{opacity:0;transform:translateY(8px) scale(.7)}to{opacity:1;transform:none}}
@keyframes term-line{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes layer-print{0%{transform:scaleX(0);opacity:.3}60%{transform:scaleX(1.06);opacity:1}100%{transform:scaleX(1);opacity:1}}
@keyframes p-layer{0%{transform:scaleX(0);opacity:0}100%{transform:scaleX(1);opacity:1}}
@keyframes p-sweep{from{transform:translateX(-17px)}to{transform:translateX(17px)}}
@keyframes p-rise{from{transform:translateY(0)}to{transform:translateY(calc(var(--rise)*-1))}}
@keyframes p-spin{to{transform:rotate(360deg)}}
.stage.enter>*{animation:rise var(--d-enter) var(--ease-out) both}
.stage.enter>*:nth-child(2){animation-delay:60ms}.stage.enter>*:nth-child(3){animation-delay:120ms}.stage.enter>*:nth-child(4){animation-delay:180ms}.stage.enter>*:nth-child(n+5){animation-delay:220ms}

/* таланты: у каждого свои бонусы и особые варианты в нескольких сценах.

}
/* сложность: стартовые деньги и размах случайных колебаний спроса */
var DIFFS = {
  easy: {id:'easy', name:'Спокойная', cash:45000, noise:0.5, price:1.02, about:'45 000 ₽ на старте, покупатели платят чуть больше, спрос почти не прыгает'},

};
var SERVICE_COST = 2500, INSURANCE_COST = 2000, INSURANCE_PAYOUT = 0.90, ALLY_FEE = 4000, ALLY_HOURS = 40, ALLY2_HOURS = 80;

function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
function round1(x){ return Math.round(x*10)/10; }

/* ---------- случайности ----------
   Результат зависит только от «кода класса» (s.seed), номера месяца и названия броска.
   Ученики с одним кодом получают одинаковые события и спрос, поэтому результаты можно честно сравнивать. */
function hashStr(str){ var h=2166136261; str=String(str); for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rngFor(s, tag){ return mulberry32(hashStr((s.seed||'free')+'|'+tag)); }
function rand01(s, tag){ return rngFor(s, tag)(); }
function randomSeed(){ return Math.random().toString(36).slice(2,8); }

function newState(name, opts){
  opts = opts || {};
  var s = { v:1, name:name||'Мастер', shop:'', talent:null, diff:'norm', code:'', seed:String(opts.seed||randomSeed()), month:1, cash:START_CASH, savings:0, fund:0, loanLeft:0, loanStep:0, equity:1,
    printers:[{t:'old', age:99}], space:'school', staff:{asst:0, teen:0},
    unlocked:{key:true, stand:true, mini:false, part:false, proto:false},
    inv:{}, invVal:{}, fil:{kg:3, val:3*1250}, filIdx:1, infl:1, rep:5,
    tax:null, channel:{market:false, site:false}, insurance:false, service:false,
    contracts:[], mods:[], flags:{}, pdm:{key:1, stand:1, mini:1, part:1, proto:1},
    unlock:{deposit:false, fund:false, loan:false},
    plan:{mode:'std', ad:0, price:{}, qty:{}}, tAdd:{key:0, stand:0, mini:0, part:0, proto:0},
    rate:{u:0, s:0}, history:[], quizScore:[], quizTotal:0, terms:[], overdrafts:0, totalRevenue:0, lastProfitPerHour:0, bestUtil:0, utilMonths:0, soldKinds:0, lastMargin:0.3 };
  PROD_IDS.forEach(function(id){ s.inv[id]=0; s.invVal[id]=0; s.plan.price[id]=PRODUCTS[id].ref; s.plan.qty[id]=0; });
  return s;
}

/* ---------- модификаторы ---------- */
/* настройка мастерской: делается один раз после пролога */
function cleanShopName(n){ return String(n||'').replace(/\s+/g,' ').trim().slice(0,28); }
function cleanCode(c){ return String(c||'').replace(/\s+/g,'').toUpperCase().slice(0,16); }
function applySetup(s, o){
  if(s.setupDone) return s;
  s.shop = cleanShopName(o.shop) || 'Слой за слоем';
  s.talent = TALENTS[o.talent] ? o.talent : null;
  s.diff = DIFFS[o.diff] ? o.diff : 'norm';
  s.code = cleanCode(o.code);
  if(s.code) s.seed = 'КЛАСС|'+s.code;
  s.cash = DIFFS[s.diff].cash;
  if(s.talent==='des'){ ['key','stand','mini'].forEach(function(id){ s.pdm[id]*=TALENTS.des.dem; }); }
  if(s.talent==='sel'){ s.rep = clamp(s.rep+TALENTS.sel.rep,0,100); }
  s.setupDone = true;
  return s;
}
function addMod(s, k, m, left, label, prod){ s.mods.push({k:k, m:m, left:left, label:label, prod:prod||null}); }
function modProd(s, k, id){ var p=1; s.mods.forEach(function(x){ if(x.k===k && (!x.prod || x.prod===id)) p*=x.m; }); return p; }
function modSum(s, k){ var t=0; s.mods.forEach(function(x){ if(x.k===k) t+=x.m; }); return t; }

/* ---------- производственные мощности ---------- */
function printerCount(s){ return s.printers.length; }
function hasBig(s){ return s.printers.some(function(p){ return PRINTERS[p.t].big; }); }
function printerHours(s){
  var h=0; s.printers.forEach(function(p){ h+=PRINTERS[p.t].hours; });
  var mult = 1 + (s.staff.asst?STAFF.asst.hours:0) + (s.staff.teen?STAFF.teen.hours:0);
  mult *= SPACES[s.space].hm * modProd(s,'hours');
  h = h*mult + (s.flags.alliance2?ALLY2_HOURS:(s.flags.ally?ALLY_HOURS:0)) + modSum(s,'hoursAdd');
  return Math.max(0, Math.round(h));
}
function baseFail(s){
  var t=0, h=0; s.printers.forEach(function(p){ var d=PRINTERS[p.t]; t+=d.fail*d.hours; h+=d.hours; });
  return h>0 ? t/h : 0.1;
}
function failRate(s, mode){
  var f = baseFail(s) + MODES[mode].fail + modSum(s,'fail') - (s.service?0.02:0) - (s.talent==='eng'?TALENTS.eng.fail:0);
  return clamp(f, 0.01, 0.35);
}
function isAvailable(s, id){
  if(!s.unlocked[id]) return false;
  var need = PRODUCTS[id].need;
  if(need==='big' && !hasBig(s)) return false;
  return true;
}
function whyLocked(s, id){
  if(!s.unlocked[id]) return 'Откроется по ходу истории';
  if(PRODUCTS[id].need==='big' && !hasBig(s)) return 'Нужен принтер большого формата';
  return '';
}

/* ---------- цены и спрос ---------- */
function filMarket(s){ return FIL_BASE * s.filIdx * modProd(s,'fil'); }
function runCostPerHour(s){ return RUN_COST * s.infl * modProd(s,'run'); }
function levelMult(s){ return (DIFFS[s.diff||'norm']||DIFFS.norm).price; }
function refPrice(s, id){ return Math.round(PRODUCTS[id].ref * s.infl * modProd(s,'ref',id) * levelMult(s) / 5) * 5; }
function p50Of(s, id){ return PRODUCTS[id].p50 * s.infl * modProd(s,'ref',id) * levelMult(s); }
function adMult(s, i){ var a=ADS[i]; return 1 + (a.mult-1)*(s.talent==='sel'?TALENTS.sel.ad:1); }
function commissionRate(s){ return CHANNELS.market.commission - (s.talent==='sel'?TALENTS.sel.comm:0); }
function channelMult(s){ return (s.channel.market?CHANNELS.market.mult:1) * (s.channel.site?CHANNELS.site.mult:1); }
function demandAt(s, id, price, plan, noise){
  var P=PRODUCTS[id], x=price/p50Of(s,id);
  var base = P.dmax / (1 + Math.pow(x, P.k));
  var repMult = 1 + s.rep*(P.b2b?0.02:0.010);
  var q = Math.pow(MODES[plan.mode].q, P.qs);
  var ch = P.b2b ? 1 : channelMult(s);
  return Math.max(0, base * SEASON[id][s.month-1] * repMult * adMult(s,plan.ad) * q * ch * modProd(s,'dem',id) * s.pdm[id] * (noise||1));
}
function priceBounds(s, id, mode){
  var ref=refPrice(s,id); var c = unitCostEst(s, id, mode||s.plan.mode, 0);
  return {min: Math.max(Math.ceil(c*1.1/5)*5, Math.round(ref*0.5/5)*5), max: Math.round(ref*2.2/5)*5};
}

/* ---------- затраты ---------- */
function fixedParts(s){
  var sp=SPACES[s.space], inf=s.infl, p={};
  p.rent = sp.rent;
  p.salary = Math.round((s.staff.asst?STAFF.asst.salary:0)*inf + (s.staff.teen?STAFF.teen.salary:0)*inf);
  p.site = s.channel.site ? CHANNELS.site.fee : 0;
  p.insurance = s.insurance ? INSURANCE_COST : 0;
  p.service = s.service ? SERVICE_COST : 0;
  p.ally = (s.flags.ally && !s.flags.alliance2) ? ALLY_FEE : 0;
  var tot=0, k; for(k in p) tot+=p[k];
  var m = modProd(s,'fixed'); 
  p.total = Math.round(tot*m);
  return p;
}
function fixedCosts(s){ return fixedParts(s).total; }
function deprMonthly(s){ var d=0; s.printers.forEach(function(p){ if(p.age<DEPR_MONTHS) d += PRINTERS[p.t].price/DEPR_MONTHS; }); return Math.round(d); }
function bookValue(s){ var v=0; s.printers.forEach(function(p){ var pr=PRINTERS[p.t].price; if(p.age<DEPR_MONTHS) v += pr*(1-p.age/DEPR_MONTHS); }); return Math.round(v); }
function loanPayment(s){ if(s.loanLeft<=0) return 0; return Math.round(Math.min(s.loanLeft, s.loanStep) + s.loanLeft*LOAN_RATE); }
function filValue(s){ return Math.round(s.fil.val); }
function invValueTotal(s){ var t=0; PROD_IDS.forEach(function(id){ t+=s.invVal[id]; }); return Math.round(t); }
function companyCapital(s){ return Math.round(s.cash + s.savings + s.fund + invValueTotal(s) + filValue(s) + bookValue(s) - s.loanLeft); }
function ownerCapital(s){ return Math.round(companyCapital(s) * s.equity); }

/* ---------- контракты и план ---------- */
function contractQty(s, id){ var q=0; s.contracts.forEach(function(c){ if(c.prod===id) q+=c.qty; }); return q; }
function lockQty(s, id){ return Math.max(0, contractQty(s,id) - s.inv[id]); }
function hoursPerUnit(s, id, mode){ var f=failRate(s,mode); return (PRODUCTS[id].t+(s.tAdd[id]||0))*MODES[mode].time*(s.talent==='eng'?TALENTS.eng.time:1)/(1-f); }
function gramsPerUnit(s, id, mode){ var f=failRate(s,mode); return PRODUCTS[id].g*MODES[mode].grams/(1-f); }
function matBlend(s, kg){
  var stockKg=s.fil.kg, avg = stockKg>0 ? s.fil.val/stockKg : 0, mk=filMarket(s);
  if(kg<=0) return stockKg>0 ? avg : mk;
  var fromStock=Math.min(kg, stockKg);
  return (fromStock*avg + (kg-fromStock)*mk)/kg;
}
function planHours(s, plan){
  var h=0; PROD_IDS.forEach(function(id){ if(isAvailable(s,id)) h += (plan.qty[id]||0)*hoursPerUnit(s,id,plan.mode); });
  return h;
}
function planKg(s, plan){
  var g=0; PROD_IDS.forEach(function(id){ if(isAvailable(s,id)) g += (plan.qty[id]||0)*gramsPerUnit(s,id,plan.mode); });
  return g/1000;
}
function unitCostEst(s, id, mode, kgOverride){
  var kg=(kgOverride==null)?planKg(s, s.plan):kgOverride, price=matBlend(s, kg);
  return gramsPerUnit(s,id,mode)/1000*price + hoursPerUnit(s,id,mode)*runCostPerHour(s);
}
function maxQtyFor(s, plan, id){
  var H=printerHours(s), used=planHours(s,plan) - (plan.qty[id]||0)*hoursPerUnit(s,id,plan.mode);
  return Math.max(lockQty(s,id), Math.floor(Math.max(0,H-used)/hoursPerUnit(s,id,plan.mode)));
}
function sanitizePlan(s, plan){
  var out = {mode:plan.mode, ad:plan.ad, price:{}, qty:{}}, H=printerHours(s);
  PROD_IDS.forEach(function(id){
    out.price[id] = plan.price[id]; 
    out.qty[id] = isAvailable(s,id) ? Math.max(lockQty(s,id), Math.max(0, Math.floor(plan.qty[id]||0))) : 0;
  });
  var used=planHours(s,out), lockH=0;
  PROD_IDS.forEach(function(id){ lockH += lockQty(s,id)*hoursPerUnit(s,id,out.mode); });
  if(used>H+0.001){
    var free=Math.max(0,H-lockH), extra=used-lockH, k = extra>0 ? free/extra : 0;
    PROD_IDS.forEach(function(id){ var lk=lockQty(s,id); out.qty[id] = lk + Math.floor((out.qty[id]-lk)*k); });
  }
  return out;
}

/* ---------- расчёт месяца (без изменения состояния) ---------- */
function computeMonth(s, rawPlan, noiseFn){
  var plan=sanitizePlan(s, rawPlan), mode=plan.mode, M=MODES[mode], f=failRate(s,mode), H=printerHours(s);
  var gN = noiseFn ? noiseFn('g') : 1;
  var hours=planHours(s,plan), kg=planKg(s,plan), mk=filMarket(s);
  var stockKg=s.fil.kg, stockAvg=stockKg>0?s.fil.val/stockKg:0;
  var fromStock=Math.min(kg,stockKg), buyKg=kg-fromStock, buyCost=buyKg*mk, matCost=fromStock*stockAvg+buyCost;
  var runCost=hours*runCostPerHour(s), matPrice=kg>0?matCost/kg:mk;
  var ad=ADS[plan.ad];
  var r={month:s.month, mode:mode, fail:f, H:H, hours:hours, kg:kg, buyKg:buyKg, buyCost:buyCost, matCost:matCost, matPrice:matPrice, runCost:runCost, adCost:ad.cost, rows:{}, plan:plan};
  var revenue=0, contractRev=0, cogs=0, commission=0, royalty=0, penalty=0, repLoss=0, repGain=0, soldKinds=0, invValEnd=0, soldTot=0, packTot=0, writeTot=0;
  var disc = modProd(s,'disc');
  PROD_IDS.forEach(function(id){
    if(!isAvailable(s,id)){ return; }
    var P=PRODUCTS[id], q=plan.qty[id], att=q/(1-f), defects=att-q;
    var unit = gramsPerUnit(s,id,mode)/1000*matPrice + hoursPerUnit(s,id,mode)*runCostPerHour(s);
    var invN=s.inv[id], valN=s.invVal[id];
    var avgCost = (invN+q)>0 ? (valN + q*unit)/(invN+q) : unit;
    var avail = invN+q;
    var cq = contractQty(s,id), cDeliver = Math.min(cq, avail);
    var cRev=0, cPen=0;
    s.contracts.forEach(function(c){ if(c.prod===id){ } });
    if(cq>0){
      var left=cDeliver;
      s.contracts.forEach(function(c){ if(c.prod!==id) return; var d=Math.min(c.qty,left); left-=d; cRev+=d*c.price; var miss=c.qty-d; if(miss>0){ cPen+=miss*c.price*c.penalty; repLoss+=c.repLoss; } else { repGain+=(c.repGain||0); } });
    }
    var price=plan.price[id], eff=price*disc;
    var nz = noiseFn ? noiseFn(id) : 1;
    var D = Math.round(demandAt(s,id,price,plan,gN*nz));
    var availMarket = avail - cDeliver;
    var sold = Math.min(D, availMarket), lost=Math.max(0,D-sold), left2=availMarket-sold;
    var rev = sold*eff;
    var cg = (sold+cDeliver)*avgCost;
    var comm = (!P.b2b && s.channel.market) ? rev*commissionRate(s) : 0;
    var roy = (id==='mini' && s.flags.liza==='partner') ? rev*0.12 : 0;
    if(s.flags.alliance2 && (id==='key' || id==='stand')) roy += rev*0.08;
    var packCost = (sold+cDeliver)*PACK[id]*s.infl;
    var endVal = left2*avgCost*(1-OBSOLETE_RATE);
    var writeOff = left2*avgCost*OBSOLETE_RATE;
    r.rows[id] = {id:id, q:q, attempts:att, defects:defects, hours:q*hoursPerUnit(s,id,mode), unit:unit, avgCost:avgCost, price:price, eff:eff, demand:D, contractUnits:cDeliver, contractQty:cq,
                  avail:availMarket, sold:sold, lost:lost, left:left2, revenue:rev, contractRev:cRev, cogs:cg, comm:comm, roy:roy, endVal:endVal, invBefore:invN, valBefore:valN,
                  pack:packCost, writeOff:writeOff, perHour: (hoursPerUnit(s,id,mode)>0) ? (eff-unit-PACK[id]*s.infl)/hoursPerUnit(s,id,mode) : 0, penalty:cPen};
    packTot+=packCost; writeTot+=writeOff; revenue+=rev; contractRev+=cRev; cogs+=cg; commission+=comm; royalty+=roy; penalty+=cPen; invValEnd+=endVal; soldTot+=sold+cDeliver;
    if(sold+cDeliver>0) soldKinds++;
  });
  var fp=fixedParts(s), fixed=fp.total, depr=deprMonthly(s);
  var storage=invValEnd*STORAGE_RATE;
  var interest=Math.round(s.loanLeft*LOAN_RATE), principal=Math.round(Math.min(s.loanLeft,s.loanStep));
  var revTot=revenue+contractRev;
  var pbt = revTot - cogs - packTot - ad.cost - fixed - depr - storage - writeTot - commission - royalty - interest - penalty;
  var tax = 0;
  if(s.tax==='rev') tax=Math.round(revTot*0.06); else if(s.tax==='profit') tax=Math.round(Math.max(pbt*0.15, revTot*TAX_MIN));
  r.revenue=revenue; r.contractRev=contractRev; r.revTot=revTot; r.cogs=cogs; r.fixed=fixed; r.fixedParts=fp; r.depr=depr; r.storage=storage; r.commission=commission; r.royalty=royalty;
  r.interest=interest; r.principal=principal; r.penalty=penalty; r.repLoss=repLoss; r.repGain=repGain; r.tax=tax; r.pbt=pbt; r.profit=pbt-tax; r.soldKinds=soldKinds; r.soldTot=soldTot; r.invValEnd=invValEnd;
  r.cashNow = buyCost + runCost + ad.cost;
  r.packTot = packTot; r.writeTot = writeTot;
  r.cashEnd = revTot - packTot - fixed - storage - commission - royalty - interest - principal - penalty - tax;
  return r;
}
function previewMonth(s, plan, noiseMul){
  return computeMonth(s, plan, function(){ return noiseMul||1; });
}

/* ---------- применение результата к состоянию ---------- */
function gauss(rng){ return (rng()+rng()+rng()+rng()-2)*1.7; }
function commitMonth(s, r, rng){
  var plan=r.plan, f=r.fail;
  s.cash -= r.cashNow;
  /* пластик */
  var fromStock = Math.min(r.kg, s.fil.kg), avg = s.fil.kg>0 ? s.fil.val/s.fil.kg : 0;
  s.fil.kg -= fromStock; s.fil.val -= fromStock*avg; if(s.fil.kg<1e-6){ s.fil.kg=0; s.fil.val=0; }
  /* склад готовой продукции */
  PROD_IDS.forEach(function(id){
    var row=r.rows[id]; if(!row){ return; }
    s.inv[id] = row.left; s.invVal[id] = row.endVal;
  });
  s.cash += r.cashEnd;
  s.loanLeft -= r.principal; if(s.loanLeft<1){ s.loanLeft=0; s.loanStep=0; }
  s.totalRevenue += r.revTot;
  /* вклад и фонд */
  r.depositGain = Math.round(s.savings*DEPOSIT_RATE); s.savings += r.depositGain;
  var rf = rng || rngFor(s,'fund'+s.month);
  var fundR = 0.008 + 0.04*gauss(rf)/1.7;
  if(s.month===15) fundR -= 0.10;
  fundR = clamp(fundR, -0.25, 0.15); r.fundR=fundR;
  var fb=s.fund; s.fund = Math.round(s.fund*(1+fundR)); r.fundGain = s.fund-fb;
  /* овердрафт */
  r.overdraft=0; r.fromSavings=0;
  if(s.cash<0 && s.savings>0){ var take=Math.min(s.savings,-s.cash); s.savings-=take; s.cash+=take; r.fromSavings=take; }
  if(s.cash<0){ r.overdraft=Math.round(-s.cash); s.loanLeft+=r.overdraft; s.loanStep=Math.max(s.loanStep, Math.round(s.loanLeft/12)); s.cash=0; s.overdrafts++; s.unlock.loan=true; }
  /* репутация */
  var ad=ADS[plan.ad];
  s.rep = clamp(s.rep*0.985 + ad.rep + (r.soldTot>0?0.4:0) - (f>0.15?1.5:0) - r.repLoss + r.repGain, 0, 100);
  s.lastMargin = r.revTot>0 ? r.profit/r.revTot : 0;
  s.lastProfitPerHour = r.hours>0 ? (r.revTot - r.cogs - 0)/Math.max(1,r.hours) : s.lastProfitPerHour;
  /* цены на пластик, возраст принтеров, модификаторы */
  s.filIdx = clamp(s.filIdx*(1 + 0.004 + ((rng ? rng() : rand01(s,'fil'+s.month))-0.5)*0.024), 0.8, 2);
  s.printers.forEach(function(p){ p.age++; });
  s.mods.forEach(function(m){ m.left--; });
  s.mods = s.mods.filter(function(m){ return m.left>0; });
  s.contracts = [];
  var util = r.H>0 ? r.hours/r.H : 0; if(util>=0.9) s.utilMonths++;
  s.maxKinds = Math.max(s.maxKinds||0, r.soldKinds);
  s.history.push({m:s.month, revenue:r.revTot, profit:r.profit, cap:ownerCapital(s), cash:s.cash, sold:r.soldTot, util:util, hours:r.hours, H:r.H});
  r.cap = ownerCapital(s); r.cashAfter = s.cash;
  s.month++;
  return r;
}
function runMonth(s, rng){
  /* без rng шум берётся из кода класса: для каждого товара свой, не зависящий от остальных решений игрока */
  var n = {}, m = s.month;
  var amp = (DIFFS[s.diff||'norm']||DIFFS.norm).noise;
  var noise = function(key){ if(!(key in n)) n[key] = 1 + ((rng ? rng() : rand01(s,'n'+m+':'+key))-0.5)*(key==='g'?0.08:0.10)*amp; return n[key]; };
  var cashBefore = s.cash;
  var r = computeMonth(s, s.plan, noise);
  commitMonth(s, r, rng);
  r.cashBefore = cashBefore;
  return r;
}

/* ---------- действия игрока ---------- */
function canBuyPrinter(s, type){
  var d=PRINTERS[type];
  if(s.cash < d.price) return {ok:false, why:'Не хватает денег'};
  if(s.printers.length >= SPACES[s.space].limit) return {ok:false, why:'Нет места: максимум '+SPACES[s.space].limit+' в этом помещении'};
  if(type==='ind' && s.month<9) return {ok:false, why:'Откроется позже'};
  return {ok:true, why:''};
}
function buyPrinter(s, type){ var c=canBuyPrinter(s,type); if(!c.ok) return c; s.cash-=PRINTERS[type].price; s.printers.push({t:type, age:0}); return c; }
var MOVE_COST = {garage:8000, cowork:3000, home:0};
function canMove(s, space){
  if(s.space===space) return {ok:false, why:'Уже здесь'};
  if(space==='school') return {ok:false, why:'Недоступно'};
  if(s.printers.length > SPACES[space].limit) return {ok:false, why:'Принтеров слишком много: в новом помещении максимум '+SPACES[space].limit};
  if(s.cash < MOVE_COST[space]) return {ok:false, why:'Не хватает денег'};
  return {ok:true, why:''};
}
function moveSpace(s, space){ var c=canMove(s,space); if(!c.ok) return c; s.cash-=MOVE_COST[space]; s.space=space; if(space==='garage'){ if(!s.flags.garageBonus){ s.flags.garageBonus=true; addMod(s,'dem',1.1,99,'Заходят с улицы'); } } return c; }
function hireStaff(s, kind){ if(s.staff[kind]) return false; s.staff[kind]=1; return true; }
function fireStaff(s, kind){ if(!s.staff[kind]) return false; s.staff[kind]=0; return true; }
function coverDeficit(s){
  if(s.cash>=0) return 0;
  var d=Math.round(-s.cash); s.loanLeft+=d; s.loanStep=Math.max(s.loanStep, Math.round(s.loanLeft/12)); s.cash=0; s.overdrafts++; s.unlock.loan=true; return d;
}

/* Окупаемость: сравниваем месяц по рыночным ценам с новым принтером и без него.
   Если текущих часов хватает на весь спрос, новый принтер будет простаивать. */
function cloneState(s){ return JSON.parse(JSON.stringify(s)); }
function paybackMonths(s, type){
  var a=cloneState(s), b=cloneState(s), d=PRINTERS[type];
  b.printers.push({t:type, age:0}); suggestPlan(a); suggestPlan(b);
  var gain = 0.6*(previewMonth(b,b.plan,1).profit - previewMonth(a,a.plan,1).profit + d.price/DEPR_MONTHS);  /* прибавка к денежному потоку, 0,6 — запас на неточность */
  return gain>1500 ? d.price/gain : 99;
}
function paybackInfo(s, type){
  var m=paybackMonths(s,type), left=TOTAL-s.month+1;
  if(m>=99) return {ok:false, text:'сейчас не окупится: текущих часов хватает на весь спрос'};
  var n=Math.max(1,Math.round(m));
  return {ok:n<=left, text:'окупится за ≈ '+n+' мес.'+(n>left?' (осталось '+left+')':'')};
}

/* рекомендация Фила: цены по рынку, часы делим по прибыли за час */
function suggestPlan(s, keepPrices){
  var plan=s.plan, mode=plan.mode;
  PROD_IDS.forEach(function(id){ plan.qty[id]=0; if(!keepPrices || !plan.price[id]) plan.price[id]=refPrice(s,id); });
  var items=[];
  PROD_IDS.forEach(function(id){
    if(!isAvailable(s,id)) return;
    var c=unitCostEst(s,id,mode), h=hoursPerUnit(s,id,mode);
    var d=demandAt(s,id,plan.price[id],plan,1);
    items.push({id:id, perHour:(plan.price[id]-c-PACK[id]*s.infl)/h, want:Math.max(0,Math.round(d)-s.inv[id]), h:h});
  });
  PROD_IDS.forEach(function(id){ plan.qty[id]=lockQty(s,id); });
  var left = printerHours(s) - planHours(s,plan);
  items.sort(function(a,b){ return b.perHour-a.perHour; });
  items.forEach(function(it){
    if(it.perHour<=0) return;
    var q = Math.max(0, Math.min(it.want - plan.qty[it.id], Math.floor(left/it.h)));
    plan.qty[it.id]+=q; left-=q*it.h;
  });
  return plan;
}

function rub(n){ n=Math.round(n); var sgn=n<0?'−':''; return sgn+Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₽'; }
function num(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function f1(x){ return (Math.round(x*100)/100).toString().replace('.',','); }
function f1d(x){ return (Math.round(x*10)/10).toString().replace('.',','); }
function pctText(x, d){ return (x*100).toFixed(d||0).replace('.',',')+'%'; }
function plural(n, a, b, c){ n=Math.abs(Math.round(n))%100; var n1=n%10; if(n>10 && n<20) return c; if(n1>1 && n1<5) return b; if(n1===1) return a; return c; }
function pcs(n){ return num(n)+' шт.'; }

/* ===== Сюжет: 16 месяцев, 4 акта. Каждый месяц — сцена с диалогом и выбором ===== */
function chip(t, k){ return {t:t, k:k||'info'}; }
function cashChip(s, n, label){ s.cash += n; return chip((n>=0?'+':'')+rub(n)+(label?' '+label:''), n>=0?'gain':'loss'); }
function repChip(s, n){ s.rep = clamp(s.rep+n, 0, 100); return chip('репутация '+(n>=0?'+':'−')+Math.abs(n), n>=0?'gain':'loss'); }
function modChip(t, good){ return chip(t, good?'gain':'loss'); }
function addModB2C(s, m, left, label){ PROD_IDS.forEach(function(id){ if(!PRODUCTS[id].b2b) addMod(s,'dem',m,left,label,id); }); }
function say(who, mood, t){ return {who:who, mood:mood, t:t}; }
function fn(v, s){ return typeof v==='function' ? v(s) : v; }
function noSpace(s){ return s.printers.length >= SPACES[s.space].limit ? 'Нет места: в этом помещении максимум '+SPACES[s.space].limit+' '+plural(SPACES[s.space].limit,'принтер','принтера','принтеров') : ''; }

function printerChoice(type, label, reply){
  var d=PRINTERS[type];
  return {label:label,
    sub:function(s){ return rub(d.price)+' · +'+d.hours+' ч печати · брак '+Math.round(d.fail*100)+'% · '+paybackInfo(s,type).text; },
    cost:d.price, req:noSpace,
    apply:function(s){ buyPrinter(s,type); return [chip(rub(-d.price),'loss'),chip('+'+d.hours+' часов печати в месяц','gain'),chip('амортизация ≈ '+rub(d.price/DEPR_MONTHS)+'/мес','info')]; },
    reply:reply};
}

/* ===== «Случаи в мастерской»: небольшие события между сюжетной сценой и планированием =====
   Выпадают примерно в половине спокойных месяцев. Выбор «случая» один раз на месяц делается по коду класса,

var MINI_BY_ID = {}; MINI.forEach(function(e){ MINI_BY_ID[e.id]=e; });

/* выпал ли случай в этом месяце: решается один раз и запоминается */
function pickMini(s){
  if(MINI_MONTHS.indexOf(s.month)<0) return '';
  var rng=rngFor(s,'mini'+s.month);
  if(rng()>=MINI_P) return '';
  var seen=s.miniSeen||[];
  var pool=MINI.filter(function(e){ return seen.indexOf(e.id)<0 && s.month>=e.from && s.month<=e.to && (!e.ok||e.ok(s)); });
  if(!pool.length) return '';
  var total=pool.reduce(function(a,e){ return a+e.w; },0), roll=rng()*total, acc=0;
  for(var i=0;i<pool.length;i++){ acc+=pool[i].w; if(roll<=acc) return pool[i].id; }
  return pool[pool.length-1].id;
}
function miniFor(s){
  s.mini=s.mini||{};
  if(s.mini[s.month]===undefined){ var id=pickMini(s); s.mini[s.month]=id; if(id){ s.miniSeen=s.miniSeen||[]; s.miniSeen.push(id); } }
  return s.mini[s.month]||'';
}
/* стадии месяца: сюжетные сцены плюс, если выпал случай, ещё одна небольшая */
function stagesOf(s){
  var st=EVENTS[s.month-1].stages(s), id=miniFor(s);
  if(id){ var e=MINI_BY_ID[id], g=e.st(s); g.mini=true; g.miniId=id; g.miniTitle=e.title; g.miniIcon=e.icon; st=st.concat([g]); }
  return st;
}

/* отзывы за месяц: {list:[{name,color,stars,id,text,who}], avg, units} */
function makeReviews(s, r){
  var m=r.month, ids=PROD_IDS.filter(function(id){ var x=r.rows[id]; return x && ((x.sold+x.contractUnits)>0 || x.lost>=3); });
  var items=[], totalUnits=0, starUnits=0, rng=rngFor(s,'rv'+m);
  ids.forEach(function(id){
    var x=r.rows[id], units=x.sold+x.contractUnits, ref=Math.max(1,refPrice(s,id)), ratio=x.price/ref, T=REV_TEXT[id], theme, stars;
    if(x.lost>=Math.max(3,x.demand*0.12) && rng()<0.75) theme='short';
    else if(r.fail>0.12 && rng()<0.7) theme='defect';
    else if(r.mode==='draft' && rng()<0.6) theme='draft';
    else if(ratio>1.22 && rng()<0.7) theme='expensive';
    else if(ratio<0.82 && rng()<0.6) theme='cheap';
    else { var sc=4.4+(r.mode==='fine'?0.5:0)+(s.rep-30)/120+(rng()-0.5)*1.3-(ratio>1.08?0.4:0); theme=sc>4.55?'praise':(sc>3.7?'mixed':'neutral'); }
    stars = {praise:5, mixed:4, neutral:3, short:3, defect:(r.fail>0.2?1:2), draft:2, expensive:3, cheap:5}[theme];
    if(units>0){ totalUnits+=units; starUnits+=units*stars; }
    var pool=T[theme]||T.neutral;
    items.push({id:id, units:Math.max(units,1), theme:theme, stars:stars, text:pool[Math.floor(rng()*pool.length)]});
  });
  /* выбираем до трёх отзывов: чем больше продано, тем вероятнее */
  var picked=[];
  while(items.length && picked.length<3){
    var tot=items.reduce(function(a,b){ return a+b.units; },0), roll=rng()*tot, k=0, acc=0;
    for(;k<items.length;k++){ acc+=items[k].units; if(roll<=acc) break; }
    picked.push(items.splice(Math.min(k,items.length-1),1)[0]);
  }
  /* имена без повторов */
  var names=REV_NAMES.slice(), list=picked.map(function(it,i){
    var ni=Math.floor(rng()*names.length), nm=names.splice(ni,1)[0];
    return {name:nm, color:REV_COLORS[hashStr(nm)%REV_COLORS.length], stars:it.stars, id:it.id, text:it.text, theme:it.theme};
  });
  /* редкая реплика героя заменяет последний отзыв */
  REV_SPECIAL.forEach(function(sp){
    if(list.length && sp.when(s,r) && rng()<sp.p && !list.some(function(l){ return l.special; })){
      list[list.length-1]={name:sp.who, color:'violet', stars:sp.stars, id:null, text:sp.t, theme:'special', special:true};
    }
  });
  return {list:list, avg: totalUnits>0 ? starUnits/totalUnits : 0, units: totalUnits};
}

var MILES = [250000,500000,750000];
/* новые награды и вехи после месяца; запоминает их в состоянии */
function checkProgress(s, r){
  s.ach=s.ach||{}; s.mile=s.mile||[];
  var got=[], mil=[];
  ACH.forEach(function(a){ if(!s.ach[a.id] && a.test(s,r)){ s.ach[a.id]=r.month; got.push(a); } });
  var cap=ownerCapital(s);
  MILES.forEach(function(m){ if(cap>=m && s.mile.indexOf(m)<0){ s.mile.push(m); mil.push(m); } });
  return {ach:got, mile:mil};
}

function epilogue(s){
  var out=[], f=s.flags;
  if(f.liza==='partner') out.push({who:'liza', t:'Лиза открыла собственную студию моделей, а ваши фигурки до сих пор продаются сериями.'});
  else if(f.liza==='license') out.push({who:'liza', t:'Лиза выложила портфолио и получила первые заказы от издателя настольных игр.'});
  else if(f.liza==='fixed' || f.liza==='fined') out.push({who:'liza', t:'С Лизой вы помирились не сразу. Но теперь у вас с ней договор, и все модели в мастерской честные.'});
  else if(f.liza==='pirate') out.push({who:'liza', t:'Лиза перестала отвечать на сообщения. Чужие модели не принесли ничего хорошего.'});
  if(f.alliance2) out.push({who:'max', t:'«Слой&Макс» стал известным брендом в городе. Макс говорит, что идея была его. Лиза говорит иначе.'});
  else if(f.ally) out.push({who:'max', t:'Макс остался союзником: его ферма по-прежнему печатает ваши заказы по ночам.'});
  else out.push({who:'max', t:'Макс открыл свою мастерскую. На ярмарках вы иногда пересекаетесь и спорите о ценах.'});
  if(f.social) out.push({who:'irina', t:'Дети получили протезы. Через месяц Ирина Сергеевна прислала открытку со словами «Спасибо, мастера».'});
  if(f.eco) out.push({who:'phil', t:'«ЭкоСлой» стал поставщиком пластика для всех школьных мастерских города.'});
  if(f.investor) out.push({who:'artem', t:'Артём Викторович вошёл в совет директоров мастерской и теперь каждый месяц просит новую презентацию.'});
  if(f.psu) out.push({who:'sem', t:'Над входом в мастерскую Семёныч повесил табличку: «Профилактика тоже приносит прибыль».'});
  else if(f.fireHappened) out.push({who:'sem', t:'Сгоревший блок питания висит на стене как напоминание о том, что риск лучше предотвращать.'});
  return out;
}

/* ---------- планирование ---------- */
function prepareMonth(){
  var plan=S.plan;
  PROD_IDS.forEach(function(id){
    var b=priceBounds(S,id,plan.mode), p=S.month===1||!plan.price[id]?refPrice(S,id):plan.price[id];
    plan.price[id]=clamp(Math.round(p/5)*5,b.min,b.max);
  });
  suggestPlan(S,true);
  fitCash();
}
function fitCash(){
  var plan=S.plan, g=0;
  while(g++<400){
    var pv=previewMonth(S,plan,1); if(pv.cashNow<=S.cash+0.5) break;
    var worst=null; PROD_IDS.forEach(function(id){ if(plan.qty[id]>lockQty(S,id) && (!worst || plan.qty[id]*PRODUCTS[id].g>plan.qty[worst]*PRODUCTS[worst].g)) worst=id; });
    if(!worst){ if(plan.ad>0){ plan.ad=0; continue; } break; }
    plan.qty[worst]=Math.max(lockQty(S,worst), plan.qty[worst]-Math.max(1,Math.round(plan.qty[worst]*0.1)));
  }
}
var MODNAMES={dem:'спрос',cost:'себестоимость',ref:'привычная цена',fixed:'постоянные расходы',hours:'часы печати',hoursAdd:'часы печати',fail:'брак',disc:'цена продажи',run:'расход на печать',fil:'цена пластика'};

function insights(r){
  var out=[], lostTotal=0;
  PROD_IDS.forEach(function(id){
    var x=r.rows[id]; if(!x) return; var P=PRODUCTS[id]; lostTotal+=x.lost;
    if(x.lost>=Math.max(3,x.demand*0.12)) out.push({k:'warn',p:5,t:'<b>'+P.short+':</b> '+x.lost+' '+plural(x.lost,'покупатель','покупателя','покупателей')+' ушли ни с чем, потому что товара не хватило. В следующий раз печатай больше или подними цену.'});
    if(x.left>=Math.max(6,x.sold*0.25) && x.demand>0) out.push({k:'warn',p:4,t:'<b>'+P.short+':</b> на складе осталось '+x.left+' шт. Нераспроданное дешевеет на 6% в месяц и занимает место.'});
    if(x.contractQty>0){ if(x.contractUnits>=x.contractQty) out.push({k:'ok',p:6,t:'<b>Заказ выполнен:</b> '+x.contractQty+' шт. отправлены клиенту вовремя. Репутация выросла.'}); else out.push({k:'bad',p:7,t:'<b>Заказ сорван:</b> не хватило '+(x.contractQty-x.contractUnits)+' шт. Штраф '+rub(x.penalty)+' и потеря репутации.'}); }
  });
  var util=r.H>0?r.hours/r.H:0;
  if(util<0.8) out.push({k:'info',p:3,t:'Часы печати использованы на '+Math.round(util*100)+'%. Свободные часы можно отдать другому товару или поддержать рекламой.'});
  else if(util>0.97 && lostTotal>5) out.push({k:'info',p:5,t:'Все часы заняты, а покупатели остались. Подними цены на самые ходовые товары или докупи принтер во вкладке «Мастерская».'});
  if(r.fail>0.12) out.push({k:'warn',p:3,t:'Брак '+Math.round(r.fail*100)+'%. Каждая бракованная деталь тратит пластик и часы. Профилактика и хороший пластик снижают брак.'});
  if(r.profit<0) out.push({k:'bad',p:8,t:'Месяц в минус. Посмотри на постоянные расходы, амортизацию и цены.'});
  if(r.overdraft) out.push({k:'bad',p:9,t:'Денег не хватило на расходы месяца. Банк закрыл дефицит '+rub(r.overdraft)+' и добавил его к долгу.'});
  if(r.fromSavings) out.push({k:'info',p:6,t:'На счету не хватало денег, поэтому '+rub(r.fromSavings)+' пришлось снять со вклада.'});
  var delta=r.cashAfter-r.cashBefore;
  if(Math.abs(delta-r.profit)>0.15*Math.max(1,Math.abs(r.profit))+1500) out.push({k:'info',p:2,t:'Прибыль и деньги на счету не совпадают: прибыль '+rub(r.profit)+', а деньги изменились на '+rub(delta)+'. Часть денег ушла в пластик и товар на складе, на погашение долга или осела во вкладах.'});
  var best=null, bv=-1e9; PROD_IDS.forEach(function(id){ var x=r.rows[id]; if(x && x.q>0 && x.perHour>bv){ bv=x.perHour; best=id; } });
  if(best) out.push({k:'info',p:1,t:'Самый выгодный товар по прибыли за час печати: <b>'+PRODUCTS[best].short+'</b> (≈ '+rub(bv)+' за час).'});
  out.sort(function(a,b){ return b.p-a.p; });
  return out.slice(0,4);
}

  h+='<div class="row"><button class="btn primary" data-act="restart">'+ico('refresh')+' Сыграть ещё раз</button><button class="btn" data-act="glossary">'+ico('book')+' Открыть словарик</button></div>';
  return h;
}
function helpHTML(){
  return '<div class="stack"><div class="lesson">'+avatarSVG('phil','happy',44)+'<div><b>Как это работает.</b> У тебя ограниченное число <b>часов печати</b>. Каждый товар занимает разное время и приносит разную прибыль.</div></div>'+
    '<ol class="stack" style="padding-left:1.3em;margin:0"><li><b>Цена.</b> Чем выше, тем меньше покупателей. Кривая рядом с товаром показывает спрос. Оранжевая точка это твоя цена.</li><li><b>Сколько напечатать.</b> Не больше, чем купят: остатки дешевеют. Не меньше, чем нужно: иначе покупатели уйдут.</li><li><b>Прибыль за час.</b> Показывает, какой товар выгоднее печатать, когда часов мало. Лучший отмечен звездой.</li><li><b>Режим печати.</b> «Быстро» экономит часы, «Тонко» делает изделия лучше и дороже в глазах покупателей.</li><li><b>Мастерская и финансы.</b> Там можно купить принтеры, нанять людей, оформить вклад и страховку.</li></ol>'+
    '<p class="muted">Прогноз приблизительный: спрос колеблется на несколько процентов, как в жизни.</p><div><button class="btn primary" data-act="closemodal">Понятно</button></div></div>';
}

/* ---------- отрисовка ---------- */
function stageHTML(){
  switch(U.screen){
    case 'title': return titleHTML();
    case 'intro': return introHTML();
    case 'setup': return setupHTML();
    case 'teacher': return teacherHTML();
    case 'qc': return qcHTML();
    case 'calib': return calibHTML();
    case 'scene': return sceneHTML();
    case 'plan': return planHTML();
    case 'run': return runHTML();
    case 'report': return reportHTML();
    case 'quiz': return quizHTML();
    case 'chapter': return chapterHTML();
    case 'lessonend': return lessonEndHTML();
    case 'final': return finalHTML();
  }
  return '';
}
function renderTools(){
  var d=isDark();
  $('#tools').innerHTML='<button class="iconbtn" data-act="glossary" aria-label="Словарик терминов" title="Словарик">'+ico('book')+'</button>'+
    '<button class="iconbtn" data-act="sound" aria-label="Звук" aria-pressed="'+soundOn+'" title="'+(soundOn?'Звук включён':'Звук выключен')+'">'+ico(soundOn?'vol':'mute')+'</button>'+
    '<button class="iconbtn" data-act="theme" aria-label="Сменить тему" title="Сменить тему">'+ico(d?'sun':'moon')+'</button>';
}
function render(keep){
  if(U.screen!=='run') clearRunTimers();
  var st=$('#stage');
  st.classList.toggle('enter',!keep);
  st.innerHTML=stageHTML();
  renderHud(); renderActionBar(); renderTools();
  if(!keep){
    window.scrollTo(0,0);
    var h=$('#pagetitle'); if(h){ try{ h.focus({preventScroll:true}); }catch(e){} }
  }
  if(U.screen==='run') startRun();
  startPrinterLoop();
  if(U.screen==='report'){ var pn=$('#profitnum'); if(pn && !keep){ var v=+pn.getAttribute('data-v'); animateNumber(pn,0,v,900,function(x){ return (x>=0?'+':'')+rub(x); }); } }
  if(S && U.screen!=='title') persist();
}
function enterMonth(){ U.screen='scene'; U.stage=0; U.res=[]; U.view=null; render(); }
function toPlan(){
  prepareMonth(); U.screen='plan'; U.tab='biz'; U.view=null; U.res=[]; render();
  if(!U.helpSeen){ U.helpSeen=true; openModal('Как это работает', helpHTML()); }
}
function copyText(text, sel){
  var done=function(){ toast('Скопировано'); };
  var fallback=function(){ var e=$(sel); if(e){ e.focus(); e.select(); } toast('Выдели текст и нажми Ctrl+C'); };
  try{ navigator.clipboard.writeText(text).then(done, fallback); }catch(e){ fallback(); }
}

/* цикл печати: каждые несколько секунд принтеры начинают следующую копию (слои и портал синхронны) */
var loopT=0;
function startPrinterLoop(){
  clearInterval(loopT); loopT=0;
  if(reduced || !$('.printer.working')) return;
  loopT=setInterval(function(){
    if(document.hidden) return;
    $$('.printer.working').forEach(function(el){ el.classList.remove('working'); void el.getBoundingClientRect(); el.classList.add('working'); });
  }, 3900);
}

/* ---------- действия ---------- */
var A={
 start:function(){
   var sv=readSave(); if(sv && !U.confirmNew){ U.confirmNew=true; render(true); return; }
   var nm=($('#pname').value||'').trim()||'Мастер'; U.confirmNew=false;
   S=newState(nm); U={screen:'intro', slide:0}; hudPrev={}; sfx('coin'); render();
 },
 continue:function(){ var sv=readSave(); if(sv){ applySave(sv); hudPrev={}; render(); } },
 loadcode:function(){ openModal('Загрузить игру','<p class="muted">Вставь код сохранения, который был показан в конце прошлого урока.</p><div class="field"><label for="loadcode">Код сохранения</label><textarea class="input" id="loadcode" rows="5" placeholder="Вставь код сюда"></textarea></div><p class="loss-t" id="loaderr" role="alert"></p><div><button class="btn primary" data-act="doload">Загрузить</button></div>'); },
 doload:function(){ var v=$('#loadcode').value; if(importCode(v)){ closeModal(); hudPrev={}; render(); toast('Игра загружена'); } else $('#loaderr').textContent='Код не подошёл. Проверь, что скопировал его целиком.'; },
 introprev:function(){ U.slide=Math.max(0,(U.slide||0)-1); render(); },
 intronext:function(){
   if((U.slide||0)===2 && !S.setupDone){ toSetup(); return; }
   U.slide=Math.min(introSlides().length-1,(U.slide||0)+1); render();
 },
 introskip:function(){ if(!S.setupDone){ toSetup(); return; } U.slide=introSlides().length-1; render(); },
 setupback:function(){ U.screen='intro'; U.slide=2; render(); },
 rname:function(){ var cur=U.setup.shop, pool=SHOP_NAMES.filter(function(x){ return x!==cur; }); U.setup.shop=pool[Math.floor(Math.random()*pool.length)]; render(true); var e=$('#shopname'); if(e) e.focus(); },
 ptalent:function(el){ U.setup.talent=el.getAttribute('data-k'); render(true); var e=$('[data-act=ptalent][data-k='+U.setup.talent+']'); if(e) e.focus(); },
 pdiff:function(el){ U.setup.diff=el.getAttribute('data-k'); render(true); var e=$('[data-act=pdiff][data-k='+U.setup.diff+']'); if(e) e.focus(); },
 setupdone:function(){
   var o=U.setup; if(!o.talent){ toast('Выбери талант: он даёт бонусы и особые варианты в сценах'); return; }
   applySetup(S,o); U.screen='intro'; U.slide=3; sfx('coin'); render();
 },
 tocalib:function(){ U.screen='calib'; U.calib={t:38+Math.floor(Math.random()*24), v:Math.random()<0.5?8+Math.floor(Math.random()*10):86+Math.floor(Math.random()*10), done:false}; render(); },
 skipcalib:function(){ enterMonth(); },
 calibstep:function(el){ var C=U.calib; C.v=clamp(C.v+(+el.getAttribute('data-d')),0,100); var r=$('#calibrange'); if(r) r.value=C.v; calibLive(); },
 calibfix:function(){
   var m=calibMeta(), g=m.q>=0.9?'perfect':(m.q>=0.6?'good':'bad');
   if(g==='perfect'){ S.rep=clamp(S.rep+3,0,100); addMod(S,'fail',-0.02,2,'Идеальный первый слой'); sfx('good'); burst(40); }
   else if(g==='good'){ S.rep=clamp(S.rep+1,0,100); sfx('coin'); }
   else { addMod(S,'fail',0.02,2,'Кривой первый слой'); sfx('bad'); }
   S.flags.calib=g; U.calib.done=true; U.calib.grade=g; render();
 },
 calibdone:function(){ enterMonth(); },
 choose:function(el){
   var i=+el.getAttribute('data-i'), st=U.stage||0, v=sceneView(), vc=v.choices[i];
   if(!vc || vc.why || (U.res&&U.res[st])) return;
   var stg=stagesOf(S)[st], c=choicesOf(S,stg)[i];
   var chips=c.apply(S, rngFor(S,'ev'+S.month+':'+st)), gap=coverDeficit(S);
   if(gap) chips.push(chip('Денег не хватило: банк покрыл '+rub(gap)+' в долг','loss'));
   addTerm(stg.term);
   U.res=U.res||[]; U.res[st]={i:i, chips:chips, reply:c.reply||null};
   sfx('click'); render(true);
   var n=$('.lesson'); if(n && n.scrollIntoView && !reduced) n.scrollIntoView({behavior:'smooth',block:'center'});
 },
 scenenext:function(){ var v=sceneView(); if((U.stage||0)<v.n-1){ U.stage=(U.stage||0)+1; U.view=null; render(); } else toPlan(); },
 help:function(){ openModal('Как это работает', helpHTML()); },
 tab:function(el){ U.tab=el.getAttribute('data-t'); render(true); },
 mode:function(el){
   S.plan.mode=el.getAttribute('data-m');
   PROD_IDS.forEach(function(id){ var b=priceBounds(S,id,S.plan.mode); S.plan.price[id]=clamp(S.plan.price[id],b.min,b.max); });
   S.plan.qty=sanitizePlan(S,S.plan).qty; fitCash(); sfx('click'); render(true);
 },
 ad:function(el){ S.plan.ad=+el.getAttribute('data-i'); fitCash(); render(true); },
 step:function(el){
   var k=el.getAttribute('data-k'), id=el.getAttribute('data-id'), d=+el.getAttribute('data-d');
   if(k==='price'){ var b=priceBounds(S,id,S.plan.mode); S.plan.price[id]=clamp(S.plan.price[id]+d,b.min,b.max); }
   else { S.plan.qty[id]=clamp(S.plan.qty[id]+d,lockQty(S,id),Math.max(lockQty(S,id),maxQtyFor(S,S.plan,id))); }
   liveUpdate();
 },
 suggest:function(){ suggestPlan(S,false); fitCash(); toast('Фил предложил план'); render(true); },
 buyp:function(el){ var t=el.getAttribute('data-t'), r=buyPrinter(S,t); if(r.ok){ sfx('coin'); toast('Куплено: '+PRINTERS[t].name); fitCash(); } else toast(r.why); render(true); },
 hire:function(el){ var k=el.getAttribute('data-k'); if(hireStaff(S,k)){ sfx('coin'); toast('Нанят: '+STAFF[k].name); } render(true); },
 fire:function(el){ var k=el.getAttribute('data-k'); fireStaff(S,k); toast('Сотрудник уволен'); S.plan.qty=sanitizePlan(S,S.plan).qty; render(true); },
 moveto:function(el){ var k=el.getAttribute('data-k'), r=moveSpace(S,k); if(r.ok){ sfx('coin'); toast('Переезд в «'+SPACES[k].name+'»'); } else toast(r.why); render(true); },
 chan:function(el){
   var k=el.getAttribute('data-k');
   if(k==='market') S.channel.market=!S.channel.market;
   else if(!S.channel.site && S.cash>=15000){ S.cash-=15000; S.channel.site=true; sfx('coin'); }
   render(true);
 },
 service:function(){ S.service=!S.service; render(true); },
 insure:function(){ S.insurance=!S.insurance; toast(S.insurance?'Страховка оформлена':'Страховка отменена'); render(true); },
 mv:function(el){
   var k=el.getAttribute('data-k'), d=el.getAttribute('data-d'), amt;
   if(d==='all') amt=Math.max(0,Math.floor(S.cash)); else if(d==='-all') amt=-S[k]; else amt=+d;
   if(amt>0) amt=Math.min(amt,Math.floor(S.cash)); else amt=-Math.min(-amt,Math.floor(S[k]));
   if(!amt){ toast(+d>0||d==='all'?'На счету нет свободных денег':'Здесь нечего забирать'); return; }
   S.cash-=amt; S[k]+=amt; sfx('click'); fitCash(); render(true);
 },
 repay:function(el){
   var d=el.getAttribute('data-d'), amt=d==='all'?S.loanLeft:+d; amt=Math.min(amt,S.loanLeft,Math.floor(S.cash)); if(amt<=0) return;
   S.cash-=amt; S.loanLeft-=amt; if(S.loanLeft<1){ S.loanLeft=0; S.loanStep=0; } else S.loanStep=Math.min(S.loanStep,S.loanLeft);
   sfx('coin'); toast('Погашено: '+rub(amt)); render(true);
 },
 go:function(){
   var pv=previewMonth(S,S.plan,1); if(pv.cashNow>S.cash+0.5){ toast('Не хватает денег на закупку. Уменьши выпуск.'); return; }
   var before=S.cash, r=runMonth(S); r.cashBefore=before; r.cashAfter=S.cash;
   r.progress=checkProgress(S,r); r.fact=factFor(S,'m'+r.month); r.reviews=makeReviews(S,r); S.rate=S.rate||{u:0,s:0}; S.rate.u+=r.reviews.units; S.rate.s+=r.reviews.avg*r.reviews.units;
   U.report=r; U.screen=reduced?'report':'run'; U.tab='biz';
   if(reduced){ render(); sfx(r.profit>=0?'good':'bad'); } else render();
 },
 runskip:function(){
   clearRunTimers(); var r=U.report; U.screen='report'; render();
   if(r.profit>0){ sfx('good'); burst(36); } else sfx('bad');
   if(r.progress&&r.progress.mile.length){ sfx('win'); burst(90); }
 },
 afterreport:function(){
   var m=U.report.month;
   if(m%4===0){ startQuiz(chapterOf(m)); render(); } else if(m%4===3){ qcStart(); } else enterMonth();
 },
 qpick:function(el){
   var Q=U.quiz; if(Q.picked!=null) return; var i=+el.getAttribute('data-i'); Q.picked=i;
   if(Q.qs[Q.i].opts[i].ok){ Q.correct++; sfx('good'); } else sfx('bad'); render(true);
 },
 qnext:function(){
   var Q=U.quiz;
   if(Q.i<Q.qs.length-1){ Q.i++; Q.picked=null; render(); return; }
   var ch=Q.ch, bonus=Q.correct*QUIZ_BONUS, m0=CHAPTERS[ch].months[0], m1=CHAPTERS[ch].months[1];
   S.cash+=bonus; S.quizScore.push(Q.correct); S.quizTotal+=Q.qs.length;
   var prof=sum(S.history.filter(function(x){ return x.m>=m0&&x.m<=m1; }).map(function(x){ return x.profit; }));
   U.chapterInfo={ch:ch, correct:Q.correct, bonus:bonus, profit:prof}; U.screen='chapter';
   if(Q.correct>=2){ sfx('win'); burst(46); } render();
 },
 chapternext:function(){
   var ch=U.chapterInfo.ch;
   if(ch===3){ U.screen='final'; var good=ownerCapital(S)>=GOAL*0.5; render(); if(good){ sfx('win'); burst(ownerCapital(S)>=GOAL?190:90); } }
   else if(ch===1){ U.screen='lessonend'; render(); }
   else enterMonth();
 },
 lessonnext:function(){ enterMonth(); },
 copysave:function(){ var e=$('#savecode'); copyText(e?e.value:'','#savecode'); },
 copyres:function(){ var e=$('#resline'); copyText(e?e.value:'','#resline'); },
 qcgo:function(){ qcNext(); },
 qcgood:function(){ qcAnswer(false); },
 qcbad:function(){ qcAnswer(true); },
 qcskip:function(){ clearTimeout(qcT); enterMonth(); },
 qcend:function(){ var g=qcGrade(); clearTimeout(qcT); if(g==='gold'){ S.rep=clamp(S.rep+2,0,100); addMod(S,'fail',-0.01,2,'Строгий контроль'); burst(40); sfx('good'); } else if(g==='silver'){ S.rep=clamp(S.rep+1,0,100); sfx('coin'); } enterMonth(); },
 teacher:function(){ U={screen:'teacher'}; render(); },
 boardgo:function(){ var v=$('#boardtxt').value; U.board=v; lsSet('lbl-board',v); render(true); },
 boardclear:function(){ U.board=''; lsSet('lbl-board',''); render(true); },
 restart:function(){ S=null; U={screen:'title'}; hudPrev={}; render(); },
 glossary:function(){ openModal('Словарик экономиста', glossaryHTML()); },
 closemodal:function(){ closeModal(); },
 modalbg:function(el, e){ if(e.target===el) closeModal(); },
 theme:function(){ var d=!isDark(); document.documentElement.setAttribute('data-theme',d?'dark':'light'); lsSet(THEME_KEY,d?'dark':'light'); renderTools(); },
 sound:function(){ soundOn=!soundOn; lsSet(SND_KEY,soundOn?'1':'0'); renderTools(); sfx('click'); toast(soundOn?'Звук включён':'Звук выключен'); },
 skipnav:function(el,e){ e.preventDefault(); var st=$('#stage'); if(st) st.focus({preventScroll:false}); }
};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var a=el.getAttribute('data-act');
  if(el.disabled || el.getAttribute('aria-disabled')==='true') return;
  if(A[a]){ if(['go','choose','qpick','start','mode'].indexOf(a)<0) sfx('click'); A[a](el,e); }
});
document.addEventListener('input',function(e){
  var t=e.target; if(!S) return;
  if(t.id==='calibrange' && U.calib){ U.calib.v=+t.value; calibLive(); return; }
  if(t.id==='shopname' && U.setup){ U.setup.shop=t.value; var sg=$('#signart'); if(sg) sg.innerHTML=signSVG(cleanShopName(t.value)||'Слой за слоем'); return; }
  if(t.id==='classcode' && U.setup){ U.setup.code=t.value; return; }
  if(U.screen==='plan' && t.type==='range' && t.getAttribute('data-k')){
    var id=t.getAttribute('data-id'), k=t.getAttribute('data-k'), val=+t.value;
    if(k==='price') S.plan.price[id]=val; else S.plan.qty[id]=clamp(val,lockQty(S,id),Math.max(lockQty(S,id),maxQtyFor(S,S.plan,id)));
    liveUpdate();
  }
});
document.addEventListener('change',function(e){ if(S && e.target && e.target.type==='range') persist(); });
document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && $('#modal .modal')){ closeModal(); return; }
  if(U.screen==='qc' && U.qc && U.qc.phase==='play' && !$('#modal .modal')){ var k=e.key.toLowerCase(); if(k==='arrowleft'||k==='г'||k==='g'){ e.preventDefault(); qcAnswer(false); return; } if(k==='arrowright'||k==='б'||k==='b'){ e.preventDefault(); qcAnswer(true); return; } }
  if(e.key==='Enter' && e.target && e.target.id==='pname'){ e.preventDefault(); A.start(); return; }
  if(e.key==='Tab' && $('#modal .modal')){
    var f=$$('#modal button, #modal textarea, #modal input, #modal a[href]').filter(function(x){ return !x.disabled; }); if(!f.length) return;
    var first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});

/* ---------- запуск ---------- */
function boot(){
  var th=lsGet(THEME_KEY); if(th) document.documentElement.setAttribute('data-theme',th);
  soundOn = lsGet(SND_KEY)==='1';
  U={screen:'title'}; S=null; render();
  window.__game={get S(){ return S; }, get U(){ return U; }, A:A, render:render, setState:function(s,u){ S=s; U=u; render(); }};
}
boot();
})();

document.getElementById('logo').innerHTML = logoSVG(36);
