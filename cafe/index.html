*{box-sizing:border-box} html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--hud-h) + 16px);scroll-padding-bottom:calc(var(--bar-h) + 16px)}
body{margin:0;font:400 16px/1.5 var(--font-b);color:var(--ink);background:var(--ground);-webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background-image:linear-gradient(90deg,var(--check-a) 50%,transparent 50%),linear-gradient(var(--check-a) 50%,transparent 50%);background-size:32px 32px;background-attachment:scroll}

p{margin:0 0 .6em} a{color:var(--brand-soft-ink)} b,strong{font-weight:800}
.muted{color:var(--ink-3)} .small{font-size:14px} .num{font-variant-numeric:tabular-nums lining-nums;font-weight:800;font-family:var(--font-b)} .gain-t{color:var(--gain-ink)} .loss-t{color:var(--loss-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--mustard);border-radius:10px}

.ic.sm{width:18px;height:18px;vertical-align:-3px} .ic.lg{width:28px;height:28px}
.dish-svg,.avatar,.stars{display:inline-block;flex:none;vertical-align:middle}

/* ---- каркас ---- */
#app{min-height:100vh}

.wrap{max-width:1080px;margin:0 auto;padding:0 var(--gutter) calc(var(--bar-h) + 24px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 8px}

.logo small{display:block;font-family:var(--font-b);font-weight:700;font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.logo-svg{flex:none}
.tools{display:flex;gap:6px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;transition:transform var(--d-fast) var(--ease-out),background var(--d-base),border-color var(--d-base)}

.stage>*{animation:rise var(--d-enter) var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---- шапка с показателями ---- */
.hud{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;margin:0 calc(var(--gutter)*-1);padding:8px var(--gutter);background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid var(--edge);transition:transform var(--d-base) var(--ease-out)}

.hud-month b{font-family:var(--font-h);font-size:18px} .hud-month span{font-size:12px;color:var(--ink-3);font-weight:700}

.stat{display:flex;flex-direction:column;align-items:center;padding:4px 10px;background:var(--surface);border:2px solid var(--edge);border-radius:12px;min-width:0;line-height:1.1}

.stat b{font-size:16px} .stat.cash b{font-size:17px}
.noanim>*{animation:none}
.hud-goal{display:flex;align-items:center;gap:8px}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)} .ring circle{fill:none;stroke-width:6;stroke-linecap:round}

.mdots li{flex:1;height:6px;border-radius:3px;background:var(--edge)} .mdots li.done{background:var(--basil)} .mdots li.now{background:var(--brand);transform:scaleY(1.7)} .mdots li.lessonend{margin-right:6px}
.hud-away .hud{transform:translateY(-100%)}

/* ---- вкладки ---- */
.tabbar{display:flex;gap:6px;margin:12px 0 4px;padding:6px;background:var(--surface);border:2px solid var(--edge);border-radius:18px;box-shadow:var(--shadow);position:sticky;top:calc(var(--hud-h) + 6px);z-index:25;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}

.tab:hover{background:var(--surface-3)} .tab:active{transform:scale(.97)}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.tl-s{display:none}
.tab .dot{position:absolute;top:5px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--mustard);border:2px solid var(--surface)}
.tab[aria-selected="true"] .dot{border-color:var(--brand)}

/* ---- кнопки ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:999px;border:2px solid var(--brand-dark);background:var(--brand);color:var(--brand-ink);font-weight:900;font-size:16px;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 var(--brand-dark);transition:transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast),filter var(--d-base);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-dark)}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--edge-strong);box-shadow:0 4px 0 var(--edge-strong)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--edge);box-shadow:none} .btn.ghost:active{transform:scale(.97)}
.btn.small{min-height:44px;padding:8px 16px;font-size:15px} .btn.wide{width:100%}

.btn .ic{width:20px;height:20px}
.link{background:none;border:0;padding:0;color:var(--brand-soft-ink);font-weight:800;text-decoration:underline;cursor:pointer;min-height:44px}

/* ---- карточки ---- */
.card{background:var(--surface);border:2px solid var(--edge);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);margin:12px 0}
.card.soft{background:var(--surface-2);box-shadow:none}

.card .sub{color:var(--ink-3);font-size:14px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px} .grid3{display:grid;grid-template-columns:1fr;gap:12px}
.stack>*{min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .row.between{justify-content:space-between} .row.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:800;line-height:1.5;background:var(--surface-3);color:var(--ink-2);border:1.5px solid transparent}
.chip.gain{background:var(--gain-bg);color:var(--gain-ink)} .chip.loss{background:var(--loss-bg);color:var(--loss-ink)} .chip.info{background:var(--info-bg);color:var(--info-ink)} .chip.warn{background:var(--warn-bg);color:var(--warn-ink)} .chip.brand{background:var(--brand-soft);color:var(--brand-soft-ink)}

.pop-in .chip{animation:pop var(--d-enter) var(--ease-spring) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.badge{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--brand);color:var(--brand-ink);font-weight:900;font-size:13px}

/* ---- мел и афиша ---- */
.chalk{position:relative;background:var(--chalk-bg);color:var(--chalk-ink);border:6px solid var(--wood);border-radius:18px;padding:16px 18px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),var(--shadow);margin:12px 0;font-family:var(--font-chalk);font-size:22px;line-height:1.25;background-image:radial-gradient(circle at 20% 15%,rgba(255,255,255,.06),transparent 40%),radial-gradient(circle at 80% 85%,rgba(255,255,255,.04),transparent 45%)}

.chalk h3 .ic{color:#FFE79A}
.chalk p{margin:0 0 .3em;color:var(--chalk-ink)} .chalk .dim{color:var(--chalk-dim);font-size:19px}
.chalk .btn{font-family:var(--font-b)}
.chalk ul{margin:.2em 0;padding:0;list-style:none} .chalk li{display:flex;gap:10px;align-items:flex-start;padding:2px 0}
.chalk li .ic{margin-top:2px;color:#FFE79A;width:20px;height:20px} .chalk li.ok{color:#C6F0C9} .chalk li.done{color:var(--chalk-dim);text-decoration:line-through;text-decoration-thickness:2px}
.chalk .bar{height:12px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden;margin:6px 0} .chalk .bar i{display:block;height:100%;background:#FFE79A;border-radius:8px;transition:width var(--d-enter) var(--ease-out)}
.coach{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-card);background:var(--warn-bg);color:var(--warn-ink);border:2px solid color-mix(in srgb,var(--warn-ink) 25%,transparent);margin:12px 0}
.coach .avatar{margin-top:2px} .coach b{display:block;font-size:15px} .coach p{margin:2px 0 6px;font-size:15px;line-height:1.45;color:inherit} .coach .btn{margin-top:4px}

/* ---- диалоги и сцены ---- */
.scene{display:block;max-width:760px;margin:0 auto}
.scene-head{display:flex;align-items:center;gap:10px;margin:8px 0 12px;flex-wrap:wrap}
.scene-head .place{display:inline-flex;gap:6px;align-items:center;font-weight:800;color:var(--ink-3);font-size:14px}
.line{display:flex;gap:12px;align-items:flex-start;margin:12px 0;animation:rise var(--d-enter) var(--ease-out) both;animation-delay:calc(var(--i,0)*140ms)}

.bubble{background:var(--surface);border:2px solid var(--edge);border-radius:6px 20px 20px 20px;padding:11px 14px;line-height:1.5;box-shadow:var(--shadow)}
.line.nar .bubble{background:var(--surface-2);border-style:dashed;border-radius:14px;color:var(--ink-2);font-style:normal;width:100%}
.line.tamara .bubble{background:#FFF3C9;color:#3A2A10;border-color:#E3C16A;font-family:var(--font-chalk);font-size:21px;line-height:1.3} :root[data-theme="dark"] .line.tamara .bubble{background:#4A3A18;color:#FFE9B0;border-color:#8A6A24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .line.tamara .bubble{background:#4A3A18;color:#FFE9B0;border-color:#8A6A24}}
.line .avatar{width:52px;height:52px}
.choices{display:grid;gap:10px;margin:14px 0}
.choice{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;min-height:64px;padding:13px 16px;border-radius:var(--r-card);border:2px solid var(--edge-strong);background:var(--surface);cursor:pointer;box-shadow:0 4px 0 var(--edge);transition:transform var(--d-fast) var(--ease-out),box-shadow var(--d-fast),border-color var(--d-base);animation:rise var(--d-enter) var(--ease-out) both;animation-delay:calc(var(--i,0)*90ms)}
.choice b{font-size:17px} .choice span{color:var(--ink-3);font-size:14.5px;line-height:1.4} .choice:hover{border-color:var(--brand)} .choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.choice.picked{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-soft-ink)}
.choice[disabled]{opacity:.5;cursor:not-allowed}
.actcard{text-align:center;padding:24px 18px;background:var(--surface);border:2px solid var(--edge);border-radius:28px;box-shadow:var(--shadow-lg);margin:18px 0;position:relative;overflow:hidden}
.actcard::before{content:'';position:absolute;inset:0 0 auto 0;height:18px;background:repeating-linear-gradient(90deg,var(--brand) 0 22px,#FFF6E6 22px 44px)}
.actcard .kicker{display:inline-block;margin:14px 0 6px;padding:2px 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand-soft-ink);font-weight:900;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.actcard h1{margin:4px 0 8px} .actcard ul{list-style:none;padding:0;margin:12px auto;max-width:420px;text-align:left;display:grid;gap:8px} .actcard li{display:flex;gap:10px;align-items:center;font-weight:700} .actcard li .ic{color:var(--basil)}

/* ---- «живое кафе» ---- */
.cafe-hero{border-radius:24px;overflow:hidden;border:2px solid var(--edge);box-shadow:var(--shadow);background:var(--surface);margin:12px 0}
.cafe-svg{display:block;width:100%;height:auto;aspect-ratio:360/220}
.cafe-hero .caption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--surface)}
.guest{animation:bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.35s);transform-origin:bottom center;transform-box:fill-box}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.smoke,.steam{animation:steam 3.2s ease-in-out infinite;transform-box:fill-box} .smoke{opacity:.7}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-6px)}}
.awning{animation:none} .bulb{animation:bulb 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.2s)}
@keyframes bulb{0%,100%{opacity:1}50%{opacity:.45}}
.cat{animation:catbreath 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom} @keyframes catbreath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.06)}}
.snow circle{animation:snow 5s linear infinite} @keyframes snow{from{transform:translateY(-6px)}to{transform:translateY(14px)}}

/* ---- блюда и меню ---- */
.dish{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;padding:12px;border:2px solid var(--edge);border-radius:18px;background:var(--surface);margin:8px 0;transition:border-color var(--d-base),background var(--d-base),transform var(--d-fast)}
.dish.on{border-color:var(--basil);background:var(--surface-2)} .dish.off{opacity:.92}

.dish>div{min-width:0} .dish .name{font-weight:900;font-size:16.5px;line-height:1.2;overflow-wrap:anywhere}
.row.nowrap>*{min-width:0} .kpi div{min-width:0} .kpi small{overflow-wrap:anywhere} .dish .meta{font-size:13px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.dish .ctl{grid-column:1/-1;display:grid;gap:8px}
.cls{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-weight:900;font-size:12.5px}
.cls.star{background:var(--gain-bg);color:var(--gain-ink)} .cls.horse{background:var(--info-bg);color:var(--info-ink)} .cls.puzzle{background:var(--warn-bg);color:var(--warn-ink)} .cls.dog{background:var(--loss-bg);color:var(--loss-ink)}
.toggle{position:relative;width:60px;height:36px;border-radius:999px;border:2px solid var(--edge-strong);background:var(--surface-3);cursor:pointer;flex:none;transition:background var(--d-base),border-color var(--d-base);padding:0}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--edge-strong);transition:transform var(--d-base) var(--ease-spring),border-color var(--d-base)}
.toggle[aria-checked="true"]{background:var(--basil);border-color:var(--basil)} .toggle[aria-checked="true"]::after{transform:translateX(24px);border-color:#fff}
.toggle[disabled]{opacity:.5;cursor:not-allowed}
.toggle-wrap{display:inline-grid;place-items:center;min-width:48px;min-height:48px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:14px;border:2px solid var(--edge-strong);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-weight:900;transition:transform var(--d-fast)} .stepper button:active{transform:scale(.92)}
.stepper button[disabled]{opacity:.4;cursor:not-allowed}
.stepper .val{min-width:76px;text-align:center;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.range{width:100%;height:36px;background:transparent;accent-color:var(--brand);margin:0;touch-action:pan-y}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:44px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--brand) var(--p,50%),var(--edge) var(--p,50%))}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:var(--edge)} input[type=range]::-moz-range-progress{height:10px;border-radius:6px;background:var(--brand)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-9px;border-radius:50%;background:var(--surface);border:3px solid var(--brand);box-shadow:0 2px 0 rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--brand)}
.price-hint{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-3)}
.slotbar{display:flex;gap:5px;margin:6px 0}
.slotbar i{flex:1;height:10px;border-radius:5px;background:var(--edge)} .slotbar i.on{background:var(--basil)} .slotbar i.full{background:var(--brand)}
.catrow{display:flex;align-items:center;gap:8px;margin:18px 0 4px;font-weight:900}
.catrow .cdot{width:12px;height:12px;border-radius:50%}
.cdot.cocoa{background:var(--cocoa)} .cdot.amber{background:#D98A2B} .cdot.sun{background:#E4B02B} .cdot.tomato{background:var(--brand)} .cdot.berry{background:var(--berry)} .cdot.basil{background:var(--basil)} .cdot.plum{background:var(--plum)} .cdot.sky{background:var(--sky)}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mq{padding:10px;border-radius:14px;border:2px solid var(--edge);background:var(--surface-2);min-height:84px} .mq h4{display:flex;align-items:center;gap:6px;margin-bottom:4px} .mq small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.35;margin-bottom:4px}
.mq ul{margin:0;padding:0;list-style:none;font-size:13.5px;font-weight:700}

/* ---- команда, зал, оборудование ---- */
.gauge{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.gauge .track{height:14px;border-radius:8px;background:var(--edge);overflow:hidden;position:relative} .gauge .track i{display:block;height:100%;background:var(--basil);border-radius:8px;transition:width var(--d-enter) var(--ease-out)}
.gauge.bottleneck .track i{background:var(--brand)} .gauge.bottleneck b{color:var(--brand-soft-ink)}
.role{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px;border:2px solid var(--edge);border-radius:16px;background:var(--surface);margin:8px 0}
.role h4{display:flex;align-items:center;gap:8px} .role .about{grid-column:1/-1;font-size:13.5px;color:var(--ink-3);margin:0}
.lvl{display:flex;gap:4px;align-items:center} .lvl i{width:14px;height:14px;border-radius:4px;background:var(--edge)} .lvl i.on{background:var(--mustard);border:1.5px solid var(--star-line)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border:2px solid var(--edge);border-radius:18px;background:var(--surface);margin:10px 0;align-items:start}
.spec.in{border-color:var(--basil);background:var(--surface-2)} .spec .fx{font-size:14px;color:var(--ink-2);margin:3px 0 8px} .spec .role-t{color:var(--ink-3);font-weight:800;font-size:13px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 12px;border:2px solid var(--edge);border-radius:16px;background:var(--surface);margin:8px 0}
.item.own{border-color:var(--basil);background:var(--surface-2)} .item .ico{width:44px;height:44px;border-radius:14px;background:var(--surface-3);display:grid;place-items:center;color:var(--brand)}
.item b{display:block} .item small{display:block;color:var(--ink-3);font-size:13.5px;line-height:1.35}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.segopt{padding:10px 8px;border:2px solid var(--edge);border-radius:14px;background:var(--surface);cursor:pointer;text-align:center;min-height:56px;font-weight:800;line-height:1.2;transition:border-color var(--d-base),background var(--d-base)} .segopt small{display:block;font-weight:600;color:var(--ink-3);font-size:12px}
.segopt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-soft-ink)} .segopt[aria-pressed="true"] small{color:inherit}
.seg2{grid-template-columns:repeat(2,1fr)} .seg4{grid-template-columns:repeat(2,1fr)}
.outsel{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:6px 0;scrollbar-width:none} .outsel::-webkit-scrollbar{display:none}
.outsel button{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;min-height:46px;border-radius:999px;border:2px solid var(--edge);background:var(--surface);font-weight:800;cursor:pointer;white-space:nowrap}
.outsel button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.outsel .here{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--mustard);color:var(--mustard-ink)}

/* ---- гости, заказы, отзывы ---- */
.mk{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:12px;border:2px solid var(--edge);border-radius:16px;background:var(--surface);margin:8px 0}
.mk.on{border-color:var(--basil);background:var(--surface-2)} .mk p{grid-column:1/-1;margin:0;font-size:13.5px;color:var(--ink-3)} .mk .reach{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.offer{padding:14px;border:2px solid var(--edge);border-radius:18px;background:var(--surface);margin:10px 0;display:grid;gap:8px}
.offer.acc{border-color:var(--basil);background:var(--surface-2)} .offer.lost,.offer.dec{opacity:.55}
.offer h4{display:flex;align-items:center;gap:8px}
.review{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;border:2px dashed var(--edge);border-radius:14px;margin:8px 0;background:var(--surface-2)}
.review .who{font-weight:900;font-size:14px} .review p{margin:2px 0 0;font-size:15px}

/* ---- деньги ---- */
.pl{margin:6px 0} .pl-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;padding:7px 0;border-bottom:2px dotted var(--edge)}
.pl-row .bar{grid-column:1/-1;height:6px;border-radius:4px;background:transparent} .pl-row .bar i{display:block;height:100%;border-radius:4px;background:var(--edge-strong);transition:width var(--d-enter) var(--ease-out)} .pl-row.plus .bar i{background:var(--basil)} .pl-row.minus .bar i{background:var(--brand)}
.pl-row.total{border-bottom:0;border-top:3px double var(--ink);padding-top:10px;margin-top:4px;font-size:18px} .pl-row.sub{opacity:.86;font-size:14.5px}
.pl-row .hint{font-size:12.5px;color:var(--ink-3);font-weight:600}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.kpi div{padding:10px 12px;border:2px solid var(--edge);border-radius:14px;background:var(--surface-2)} .kpi small{display:block;font-size:12px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em} .kpi b{font-size:20px;display:block;line-height:1.2;overflow-wrap:anywhere} .kpi i{font-style:normal;font-size:12.5px;color:var(--ink-3);font-weight:700}
.kpi .ok{border-color:var(--basil)} .kpi .bad{border-color:var(--brand)}
.spark{width:100%;height:80px;display:block} .spark .a{stroke:var(--brand);fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round} .spark .f{fill:var(--brand-soft);opacity:.8} .spark .g{stroke:var(--edge-strong);stroke-dasharray:4 5;stroke-width:1.5}
.spark text{font-size:10px;fill:var(--ink-3);font-weight:700;font-family:var(--font-b)}
.loanbox{display:grid;gap:10px}

/* ---- чек: итоги месяца ---- */
.ticket{position:relative;background:#FFFEF9;color:#2B1810;border:0;padding:22px 20px;margin:14px 0;filter:drop-shadow(0 8px 14px rgba(43,24,16,.25));font-family:var(--font-b);
  -webkit-mask:radial-gradient(circle 8px at 8px 0,transparent 98%,#000) top left/16px 51% repeat-x,radial-gradient(circle 8px at 8px 100%,transparent 98%,#000) bottom left/16px 51% repeat-x;mask:radial-gradient(circle 8px at 8px 0,transparent 98%,#000) top left/16px 51% repeat-x,radial-gradient(circle 8px at 8px 100%,transparent 98%,#000) bottom left/16px 51% repeat-x}
:root[data-theme="dark"] .ticket{background:#F6EBD9} @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ticket{background:#F6EBD9}}
.ticket h2{font-size:24px;text-align:center} .ticket .tag{text-align:center;font-weight:800;letter-spacing:.14em;font-size:12px;color:#7D6253;text-transform:uppercase;margin-bottom:6px}
.ticket .pl-row{border-bottom-color:#D7C7AE} .ticket .pl-row .hint{color:#6B5545} .ticket .pl-row .bar i{background:#B7A58B} .ticket .pl-row.plus .bar i{background:#2E7D4F} .ticket .pl-row.minus .bar i{background:#D1361A}
.ticket .pl-row.total{border-top-color:#2B1810} .ticket .gain-t{color:#14632F} .ticket .loss-t{color:#9A1F10}
.ticket .muted{color:#6B5545}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.cal i{position:relative;aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#2B1810;background:color-mix(in srgb,var(--brand) calc(var(--h,0)*1%),#F2E7D3);animation:tile var(--d-enter) var(--ease-spring) both;animation-delay:calc(var(--i)*28ms)}
.cal i.hi{color:#fff} .cal i.we{outline:2px solid rgba(43,24,16,.18);outline-offset:-2px}
@keyframes tile{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.funnel{display:grid;gap:6px;margin:8px 0} .fun{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center} .fun .t{font-weight:800;font-size:14px} .fun .bar{grid-column:1/-1;height:20px;border-radius:7px;background:rgba(0,0,0,.07);overflow:hidden} .fun .bar i{display:block;height:100%;background:var(--brand);border-radius:7px;transition:width .6s var(--ease-out)} .fun.lost .bar i{background:var(--edge-strong)} .fun small{grid-column:1/-1;color:#6B5545;font-size:12.5px;margin-top:-2px}
.insight{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px;border-radius:16px;border:2px solid var(--edge);background:var(--surface);margin:8px 0}
.insight .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.insight.good .ico{background:var(--gain-bg);color:var(--gain-ink)} .insight.warn .ico{background:var(--warn-bg);color:var(--warn-ink)} .insight.info .ico{background:var(--info-bg);color:var(--info-ink)}
.insight b{display:block} .insight p{margin:2px 0 0;font-size:14.5px;color:var(--ink-2)}

/* ---- карта сети ---- */
.map-card{padding:10px}
.map-svg{display:block;width:100%;height:auto;border-radius:16px}
.pin{cursor:pointer} .pin .dot{transition:r var(--d-base) var(--ease-spring)} .pin .halo{transition:opacity var(--d-base)} .pin:hover .halo{opacity:.3}
.plabel{fill:var(--ink);paint-order:stroke;stroke:var(--map-land);stroke-width:3px;stroke-linejoin:round;font-family:var(--font-b)}
.pin.sel .dot{stroke-width:3.2} .pin.sel .halo{opacity:.35;animation:ping 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center} @keyframes ping{0%{transform:scale(.8)}100%{transform:scale(1.5);opacity:0}}
.pin:focus-visible{outline:none} .pin:focus-visible .dot{stroke:var(--mustard);stroke-width:4}
.city-card h3{display:flex;gap:10px;align-items:center}
.pgrid{display:grid;gap:6px;margin:8px 0} .prow{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;font-size:13.5px} .prow .t{height:10px;border-radius:6px;background:var(--edge);overflow:hidden} .prow .t i{display:block;height:100%;background:var(--brand);border-radius:6px}

/* ---- мини-игры и викторина ---- */
.rush{position:relative;display:grid;gap:12px}
.tickets{display:flex;gap:8px;overflow:hidden;min-height:100px;padding:6px 0}
.tk{flex:none;width:96px;padding:8px;border-radius:12px;background:#FFFEF9;color:#2B1810;border:2px solid #D7C7AE;text-align:center;position:relative;transition:transform var(--d-base) var(--ease-out);animation:tkin var(--d-enter) var(--ease-spring) both}
.tk.first{border-color:var(--brand);transform:translateY(-4px)} .tk .tm{height:6px;border-radius:3px;background:#E9DFCE;overflow:hidden;margin-top:6px} .tk .tm i{display:block;height:100%;background:var(--brand)}
@keyframes tkin{from{opacity:0;transform:translateY(-20px) scale(.8)}to{opacity:1;transform:none}}
.station{display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .station button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:78px;padding:8px 4px;border-radius:16px;border:2px solid var(--edge-strong);background:var(--surface);font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 4px 0 var(--edge);touch-action:manipulation} .station button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.timer{height:12px;border-radius:7px;background:var(--edge);overflow:hidden} .timer i{display:block;height:100%;background:var(--brand);width:100%}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:52px;padding:10px 14px;border-radius:16px;border:2px solid var(--edge-strong);background:var(--surface);cursor:pointer;font-weight:700;transition:border-color var(--d-base),background var(--d-base)}
.opt:hover{border-color:var(--brand)} .opt.right{border-color:var(--basil);background:var(--gain-bg);color:var(--gain-ink)} .opt.wrong{border-color:var(--brand);background:var(--loss-bg);color:var(--loss-ink)}
.opt .k{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-weight:900;flex:none}

/* ---- титульный экран, пролог, настройка ---- */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin:12px 0}
.hero>*{min-width:0}
.hero-card{background:var(--surface);border:2px solid var(--edge);border-radius:28px;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero-card .cafe-svg{aspect-ratio:360/200}
.hero-body{padding:18px} .hero h1{margin:0 0 6px} .hero .lead{color:var(--ink-2);font-size:17px}
.hero .btns{display:grid;gap:10px;margin-top:14px}
.btnrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px} .btnrow.three{grid-template-columns:repeat(3,minmax(0,1fr))} .btnrow .btn{padding:8px 8px;font-size:14px;gap:6px;white-space:normal;line-height:1.15;text-align:center}
.map-card .map-svg{max-height:440px;margin:0 auto}
.intro-art{width:100%;max-width:420px;height:auto;display:block;margin:0 auto 12px;border-radius:18px}
.slide{padding:18px;border:2px solid var(--edge);border-radius:24px;background:var(--surface);box-shadow:var(--shadow);margin:12px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0} .dots i{width:10px;height:10px;border-radius:50%;background:var(--edge)} .dots i.on{background:var(--brand);transform:scale(1.25)}
.field{display:grid;gap:6px;margin:12px 0} .field label{font-weight:900} .field input[type=text]{min-height:48px;padding:10px 14px;border-radius:14px;border:2px solid var(--edge-strong);background:var(--surface);width:100%}
.field .hint{font-size:13.5px;color:var(--ink-3)}
.pick{display:grid;gap:8px} .pick button{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:16px;border:2px solid var(--edge);background:var(--surface);cursor:pointer;min-height:64px}
.pick button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-soft-ink)} .pick b{display:block} .pick small{color:inherit;opacity:.85;font-size:14px;display:block;line-height:1.35}
.pick .ico{width:46px;height:46px;border-radius:14px;background:var(--surface-3);display:grid;place-items:center;color:var(--brand)}

/* ---- награды, словарик, модальные окна ---- */
.awards{display:grid;gap:8px} .award{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px;border-radius:14px;border:2px solid var(--edge);background:var(--surface-2)} .award.off{opacity:.55} .award .fico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--mustard);color:var(--mustard-ink)} .award.off .fico{background:var(--surface-3);color:var(--ink-3)} .award small{display:block;color:var(--ink-3);font-size:13px}
.terms{display:grid;gap:8px} .termc{padding:10px 12px;border-radius:14px;border:2px solid var(--edge);background:var(--surface-2)} .termc b{display:block} .termc span{color:var(--ink-2);font-size:14.5px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(27,18,14,.6);display:grid;place-items:end center;animation:fade var(--d-base) both;padding:0}
.modal-box{width:100%;max-width:620px;max-height:90vh;overflow:auto;background:var(--surface);border:2px solid var(--edge);border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg);animation:sheet var(--d-enter) var(--ease-out) both}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;position:sticky;top:-18px;background:var(--surface);padding:6px 0;z-index:1}
@keyframes fade{from{opacity:0}to{opacity:1}} @keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + 14px);transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:999px;font-weight:800;box-shadow:var(--shadow-lg);max-width:92vw;width:max-content;animation:rise var(--d-enter) var(--ease-out) both}
#fx{position:fixed;inset:0;pointer-events:none;z-index:110;width:100%;height:100%}
textarea.code{width:100%;min-height:110px;border-radius:14px;border:2px solid var(--edge-strong);background:var(--surface-2);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}

/* ---- v2: задания, постоянные гости, конкуренты, мини-игры, диплом ---- */
.hearts{display:inline-flex;gap:2px;vertical-align:-3px} .heart{width:16px;height:16px;fill:var(--edge);stroke:var(--edge-strong);stroke-width:1.6;stroke-linejoin:round} .heart.on{fill:var(--brand);stroke:var(--brand-dark)}
.regs{display:grid;gap:8px} .reg{display:flex;gap:12px;align-items:center;padding:8px 10px;border:2px solid var(--edge);border-radius:14px;background:var(--surface-2)}

/* ---------- месяц целиком ---------- */
function cloneState(s){ return JSON.parse(JSON.stringify(s)); }
function simMonth(s, opts){
  opts=opts||{}; var m=s.month, cal=CAL[m-1], R={m:m, cal:cal, act:actOf(m), outlets:[], fran:[], total:{}};
  var env={cal:cal};
  var diff=DIFFS[s.diff];
  var tag=opts.preview?'pv':'run';
  var own=ownOutlets(s), live=liveOutlets(s);
  var tot={rev:0,dineRev:0,delRev:0,banRev:0,cogs:0,wages:0,rent:0,util:0,mkt:0,other:0,delComm:0,guests:0,royalty:0,hq:0,hqWages:0};
  live.forEach(function(o){
    var rng=rngFor(s,tag+m+'|'+o.id), r=simOutlet(s,o,env,rng); R.outlets.push(r);
    ['rev','dineRev','delRev','banRev','cogs','wages','rent','util','mkt','other','delComm','guests'].forEach(function(k){ tot[k]+=r[k]; });
  });
  /* заведения на ремонте: только аренда и коммуналка */
  s.outlets.forEach(function(o){ if(o.built && o.fmt!=='fran'){ var city=CITIES[o.city], F=FORMATS[o.fmt]; var rr=city.rent*F.rent, uu=F.util*0.3; tot.rent+=rr; tot.util+=uu; R.outlets.push({id:o.id, city:o.city, name:o.nm, fmt:o.fmt, building:o.built, rent:rr, util:uu, rev:0, cogs:0, wages:0, mkt:0, other:0, delComm:0, guests:0, profitOp:-rr-uu, days:[], mix:[], reviews:[], dims:{}, rating:stars(o.rep), repNew:o.rep}); } });
  franOutlets(s).forEach(function(o){ if(o.built){ return; } var r=simFranchise(s,o,env,rngFor(s,tag+m+'|'+o.id)); R.fran.push(r); tot.royalty+=r.royalty-r.support; });
  /* штаб-квартира */
  var n=own.length;
  tot.hq=(n>=2?18000*(n-1)*s.cidx+0.012*tot.rev:0)+(s.hq.upg.charity?18000:0)+(s.hq.upg.site?6000:0)+(s.hq.upg.central?60000:0)+(s.insured?7000*n:0);
  Object.keys(s.specs).forEach(function(id){ if(SPECS[id].where==='hq') tot.hqWages+=SPECS[id].wage; });
  tot.hq+=tot.hqWages;
  var costsDeduct=tot.cogs-R.outlets.reduce(function(a,r){ return a+(r.deductCogs===0?r.cogs:0); },0)+tot.wages+tot.rent+tot.util+tot.mkt+tot.other+tot.delComm+tot.hq;
  var interest=s.debt*(BANK.rate-(s.talent==='biz'?0.003:0)-(s.hq.upg.fin?0.002:0))+s.emerg*0.035;
  var revTax=tot.rev+tot.royalty;
  var tax6=0.06*revTax, tax15=Math.max(0.01*revTax, 0.15*Math.max(0,revTax-costsDeduct-interest)), tax=(s.tax==='15'?tax15:tax6);
  if(s.flags.emmaAuto) tax=Math.min(tax6,tax15);
  if(s.hq.upg.fin) tax*=0.96;
  if(hasSpec(s,'emma')) tax*=0.92;
  var pre=tot.rev+tot.royalty-tot.cogs-tot.wages-tot.rent-tot.util-tot.mkt-tot.other-tot.delComm-tot.hq-interest;
  var div=(s.invest&&pre-tax>0)?(pre-tax)*INVESTOR.share:0; if(s.flags.nazMerge && pre-tax>0) div+=(pre-tax)*0.15;
  var profit=pre-tax-div;
  R.depInterest=s.dep*0.009; R.total=tot; R.interest=interest; R.tax=tax; R.tax6=tax6; R.tax15=tax15; R.div=div; R.profit=profit; R.pre=pre; R.revTotal=revTax; R.costsDeduct=costsDeduct;
  R.cashBefore=s.cash; R.guests=tot.guests;
  var wsum=0, rsum=0; R.outlets.forEach(function(r){ if(r.guests>0){ wsum+=r.guests; rsum+=r.rating*r.guests; } });
  R.rating=wsum?rsum/wsum:(flagship(s).rep?stars(flagship(s).rep):3);
  return R;
}
/* применяет итоги месяца к состоянию (после просмотра пользователем «Печать»), без случайностей: всё уже посчитано в R */
function applyMonth(s, R){
  var m=s.month, live=liveOutlets(s);
  s.cash+=R.profit; s.dep+=(R.depInterest||0);
  s.outlets.forEach(function(o){
    if(o.built){ o.built--; if(o.built===0){ o.openM=m+1; logEv(s,'city','Открылось заведение: '+CITIES[o.city].n); } return; }
    var r=null; R.outlets.forEach(function(x){ if(x.id===o.id) r=x; });
    if(!r || r.building) return;
    o.rep=r.repNew; o.awr=r.awrNew; o.loy=r.loyNew; o.trained={};
    (r.banNote||[]).forEach(function(b){ if(b.ok){ o.rep=clamp(o.rep+1.2+(b.bonus&&b.bonus.rep||0),0,100); o.awr=clamp(o.awr+(b.bonus&&b.bonus.awr||0),0,1); o.loy=clamp(o.loy+(b.bonus&&b.bonus.loy||0),0,1); if(b.bonus&&b.bonus.brand) s.hq.brand=clamp(s.hq.brand+b.bonus.brand,0,100); } else { o.rep=clamp(o.rep-3,0,100); } });
    var u=r.utilK; var target=64+PAYS[o.pay].mor*1.6+(u>1.05?-14:(u<0.45?-4:4))+(s.talent==='host'?6:0)+(hasSpec(s,'arsen')?3:0)+(r.absent?-8:0)+(s.hq.upg.charity?2:0)+(o.mgr?3:0)+(s.hq.upg.school?3:0)+(specAt(s,'mila',o)?4:0);
    o.mor=clamp(o.mor+(target-o.mor)*0.4,0,100);
    o.hist.push({m:m, rev:r.rev, profit:r.profitOp, guests:r.guests, rating:r.rating}); if(o.hist.length>20) o.hist.shift();
    o.last={rev:r.rev, guests:r.guests, rating:r.rating, profit:r.profitOp};
    o.mk.blog=0; if(o.hol){ s.stats.holidays++; o.hol=0; }
  });
  franOutlets(s).forEach(function(o){ if(o.built){ o.built--; if(o.built===0){ o.openM=m+1; } } });
  /* инфляция */
  var infl=DIFFS[s.diff].infl*modM(s,'infl'); s.cidx*=1+infl; s.widx*=1+infl*0.7; s.pidx*=1+infl*0.62;
  /* брендa */
  var avgRep=live.length?sumArr(live.map(function(o){ return o.rep; }))/live.length:40;
  s.hq.brand=clamp(s.hq.brand*0.985+0.5*live.length+avgRep*0.015+(s.hq.upg.brand?0.6:0)+(R.outlets.length>1?0.4:0),0,100);
  /* срок действия модификаторов */
  s.mods.forEach(function(x){ x.left--; }); s.mods=s.mods.filter(function(x){ return x.left>0; });
  /* заём и экстренный долг */
  s.emergStep=0;
  if(s.cash<0){ var need=-s.cash; s.emerg+=need; s.cash=0; s.emergStep=need; live.forEach(function(o){ o.rep=clamp(o.rep-2,0,100); }); }
  /* уходы персонала при низком настроении */
  R.quits=[];
  live.forEach(function(o){ if(o.mor<42){ var rr=rngFor(s,'quit'+m+'|'+o.id)(); if(rr<0.3){ var roles=['cook','wait','bar','cln'].filter(function(k){ return o.staff[k]>(k==='cln'?0:1); }); if(roles.length){ var role=roles[Math.floor(rngFor(s,'quitr'+m+o.id)()*roles.length)]; o.staff[role]--; R.quits.push({o:o.id, role:role}); } } } });
  R.goals=settleGoals(s,R); R.regs=updateRegulars(s,R);
  s.hist.push({m:m, rev:R.revTotal, profit:R.profit, cash:s.cash, cap:capital(s), rating:R.rating, guests:R.guests, outlets:ownOutlets(s).length});
  if(R.profit>0 && R.profit>(s.best||0)) s.best=R.profit;
  s.lastR=slimR(R);
  s.accepted=[];
  s.month++;
  return s;
}

function slimR(R){ return {m:R.m, rating:R.rating, profit:R.profit, total:R.total, tax6:R.tax6, tax15:R.tax15, interest:R.interest, outlets:R.outlets.map(function(r){ return {id:r.id, city:r.city, name:r.name, fmt:r.fmt, rev:r.rev, guests:r.guests, utilK:r.utilK, dims:r.dims, rating:r.rating, building:r.building, caps:r.caps}; })}; }
function ownerOutletValue(s){ return sumArr(s.outlets.map(function(o){ return o.fmt==='fran'?0:0.55*(o.inv||0); })); }
function capital(s){ return s.cash+(s.dep||0)-s.debt-s.emerg+ownerOutletValue(s); }
function netWorth(s){ return capital(s); }
function goalNow(s){
  var d=DIFFS[s.diff], cities=cityCountOpenWithFran(s);
  var avgR=networkRating(s);
  return {cities:cities, needCities:d.cities, cap:capital(s), needCap:d.cap, rating:avgR, needRating:d.rating,
    okCities:cities>=d.cities, okCap:capital(s)>=d.cap, okRating:avgR>=d.rating-0.001};
}
function cityCountOpenWithFran(s){ var m={}; s.outlets.forEach(function(o){ if(!o.built) m[o.city]=1; }); return Object.keys(m).length; }
function networkRating(s){ var live=liveOutlets(s).concat(franOutlets(s).filter(function(o){ return !o.built; })); if(!live.length) return 0; return sumArr(live.map(function(o){ return stars(o.rep); }))/live.length; }
function goalMet(s){ var g=goalNow(s); return g.okCities && g.okCap && g.okRating; }

/* ---------- действия игрока ---------- */

function labCost(s,d){ return Math.round(d.lab*(s.talent==='cook'?0.67:1)*(s.hq.upg.rd?0.5:1)/500)*500; }
function A_lab(s,id){ var d=DISH[id]; if(!d || d.u!=='lab') return res(false); if(s.lab[id]) return res(true); if(s.month<d.min) return res(false,'Это блюдо можно разработать с '+d.min+'-го месяца.'); var c=labCost(s,d), r=pay(s,c); if(!r.ok) return r; s.lab[id]=1; return res(true,'Рецепт «'+d.n+'» разработан.'); }
function A_hire(s,oid,role){ var o=outletById(s,oid), c=ROLES[role].hire; if(!o) return res(false); if(o.staff[role]>=8) return res(false,'Слишком много людей для одного заведения.'); var r=pay(s,c); if(!r.ok) return r; o.staff[role]++; return res(true,'Нанят: '+ROLES[role].n.toLowerCase()+'.'); }

function A_mk(s,oid,id){ var o=outletById(s,oid); if(!o) return res(false); o.mk[id]=o.mk[id]?0:1; return res(true); }

function A_mgr(s,oid){ var o=outletById(s,oid); if(!o) return res(false); if(o.mgr){ o.mgr=0; return res(true,'Управляющий уволен.'); } var r=pay(s,MGR.hire); if(!r.ok) return r; o.mgr=1; return res(true,'Управляющий нанят.'); }
function specAvail(s,id){ var sp=SPECS[id]; if(s.month<sp.min) return false; if(id==='arsen' && !s.flags.arsenMet) return false; if(id==='lera' && !s.flags.leraMet) return false; if(id==='sonya' && !s.flags.sonyaMet) return false; if(id==='damir' && !s.flags.damirMet) return false; if(id==='anton' && s.month<9) return false; return true; }
function A_spec(s,id,oid){ var sp=SPECS[id]; if(!sp) return res(false); if(s.specs[id]){ delete s.specs[id]; var o0=outletById(s,s.specs[id]); return res(true,'Сотрудник ушёл из команды.'); } if(!specAvail(s,id)) return res(false,'Пока недоступен.'); var o=outletById(s,oid); if(sp.where==='outlet' && !o) return res(false); if(sp.where==='outlet'){ var busy=Object.keys(s.specs).filter(function(k){ return s.specs[k]===oid && SPECS[k].where==='outlet'; }).length; if(busy>=2) return res(false,'В одном заведении не больше двух особых людей.'); } var r=pay(s,sp.hire); if(!r.ok) return r; s.specs[id]=(sp.where==='hq'?'hq':oid); logEv(s,'team',sp.name+' в команде'); return res(true,sp.name+' теперь в команде.'); }
function A_hq(s,id){ var u=HQUPD[id]; if(!u||s.hq.upg[id]) return res(false); if(s.month<u.min) return res(false,'Это откроется с '+u.min+'-го месяца.'); if(u.req && !s.hq.upg[u.req]) return res(false,'Сначала: «'+HQUPD[u.req].n+'».'); if(id==='central' && ownOutlets(s).length<3) return res(false,'Центральная кухня нужна от трёх заведений.'); if(id==='buy' && ownOutlets(s).length<2) return res(false,'Совместные закупки имеют смысл от двух заведений.'); var r=pay(s,u.cost); if(!r.ok) return r; s.hq.upg[id]=1; logEv(s,'hq','Штаб: «'+u.n+'»'); return res(true,'Готово: «'+u.n+'».'); }
function loanLimit(s){ return BANK.limit+(s.hq.brand>40?500000:0)+(ownOutlets(s).length>=3?500000:0); }

function A_invest(s){ if(s.invest) return res(false,'Инвестор уже вошёл в дело.'); s.invest=1; s.cash+=INVESTOR.sum; logEv(s,'money','В дело вошёл инвестор'); return res(true,'Артём Викторович вложил '+rub(INVESTOR.sum)+' и получает 20% прибыли.'); }

/* какие случаи ждут в этом месяце: не больше двух, одинаковые подряд не повторяются */
function pickEvents(s){
  var m=s.month, rng=rngFor(s,'ev'+m), seen=s.seen||{}, out=[];
  var n=(m<=2?0:(m<=5?1:(rng()<0.65?2:1)));
  if(m===1||m===16) n=0;
  var pool=EVENTS.filter(function(e){ if(e.min && m<e.min) return false; if(e.max && m>e.max) return false; if(e.ok && !e.ok(s)) return false; if(seen['ev_'+e.id]) return false; return true; });
  for(var i=0;i<n && pool.length;i++){
    var tot=sumArr(pool.map(function(e){ return e.w||1; })), r=rng()*tot, acc=0, pick=0;
    for(var j=0;j<pool.length;j++){ acc+=pool[j].w||1; if(r<=acc){ pick=j; break; } }
    out.push(pool[pick].id); pool.splice(pick,1);
  }
  return out;
}

function stepNews(s){
  var m=s.month, rng=rngFor(s,'news'+m);
  s.news=(s.news||[]).filter(function(x){ return x.start+x.dur>m; });
  if(m<3 || rng()>0.5) return null;
  var active=s.news.map(function(x){ return x.id; });
  var pool=NEWS.filter(function(n){ return n.min<=m && active.indexOf(n.id)<0; });
  if(!pool.length) return null;
  var N=pool[Math.floor(rng()*pool.length)];
  s.news.push({id:N.id, start:m, dur:N.dur});
  N.mods.forEach(function(x){ s.mods.push({k:x.k, m:x.m, left:N.dur, why:N.n}); });
  return N;
}

function dynQuestions(s, R){
  var out=[]; if(!R || !R.total || !(R.total.rev>0)) return out;

  function mk(q,c,why){ var base=Math.round(c); var opts=[base, base+7, Math.max(2,base-6), base+14].map(function(v){ return v+'%'; }); var order=[0,1,2,3]; var rr=rngFor(s,'dq'+q.length+s.month); for(var i=3;i>0;i--){ var j=Math.floor(rr()*(i+1)), tmp=order[i]; order[i]=order[j]; order[j]=tmp; } var a=order.map(function(k){ return opts[k]; }); return {q:q, a:a, c:order.indexOf(0), why:why, dyn:1}; }
  out.push(mk('Какую долю выручки составили продукты (фуд-кост) в прошлом месяце?', fc, 'Фуд-кост = продукты ÷ выручка. У вас: '+fc+'%.'));
  out.push(mk('Какую долю выручки составили продукты и зарплаты вместе (прайм-кост)?', pr, 'Прайм-кост = (продукты + зарплаты) ÷ выручка. У вас: '+pr+'%.'));
  return out;
}

}

/* сильные и слабые места месяца: короткие карточки для итогового экрана */
function monthInsights(s,R){
  var out=[], t=R.total, live=R.outlets.filter(function(r){ return !r.building && r.rev>0; });
  if(!live.length || !(t.rev>0)) return out;
  var fc=t.cogs/t.rev, lab=t.wages/t.rev, prime=fc+lab, rentS=t.rent/t.rev;
  function add(k,h,tx,term){ out.push({k:k,h:h,t:tx,term:term}); }
  if(fc>0.37) add('warn','Продукты дороги','Продукты съели '+pct(fc)+' выручки. Ориентир 28–33%. Пересмотрите блюда с низкой маржой, цены и поставщика.','foodcost');
  else if(fc<0.27) add('good','Продукты в порядке','Фуд-кост '+pct(fc)+': отличный результат. Проверьте, что качество не страдает.','foodcost');
  if(prime>0.68) add('warn','Прайм-кост высокий','Продукты и зарплаты вместе '+pct(prime)+' выручки. Выше 65% остаётся мало на аренду и налоги.','prime');
  else if(prime<0.58) add('good','Прайм-кост хороший','Продукты и зарплаты вместе '+pct(prime)+'. Есть запас на развитие.','prime');
  if(rentS>0.16) add('warn','Аренда тяжёлая','Аренда занимает '+pct(rentS)+' выручки. Нужно больше гостей или выше чек.','rent');
  /* самая большая потеря гостей */
  var worst=null;
  live.forEach(function(r){ if(!r.m) return; var m=r.m, arr=[['cap',m.cap,'Не хватило мест, официантов или кухни'],['menuprice',m.menuprice,'Гости ушли из-за меню и цен'],['aware',m.aware,'Многие просто не знают о вас'],['stock',m.stock,'Блюда заканчивались (стоп-лист)']]; arr.forEach(function(x){ if(!worst || x[1]>worst.v) worst={v:x[1], k:x[0], t:x[2], r:r}; }); });
  if(worst && worst.v>60) add('info','Где теряются гости', worst.t+': около '+Math.round(worst.v)+' человек за месяц в «'+CITIES[worst.r.city].n+'».', worst.k==='cap'?'capacity':(worst.k==='aware'?'loyalty':(worst.k==='stock'?'stock':'pricing')));
  var capBound=live.filter(function(r){ return r.utilK>1.0; })[0];
  if(capBound){ var c=capBound.caps, mn=Math.min(c.seat,c.svc,c.kit); var what=mn===c.seat?'мест в зале':(mn===c.svc?'официантов и баристы':'мощности кухни'); add('warn','Узкое место','Заведению в «'+CITIES[capBound.city].n+'» не хватает '+what+'. Именно оно ограничивает выручку.','capacity'); }
  var w=live.filter(function(r){ return r.waste>0.10; })[0];
  if(w) add('warn','Много порчи','В «'+CITIES[w.city].n+'» портится '+pct(w.waste)+' продуктов. Уменьшите запас или купите холодильную камеру.','waste');
  var so=live.filter(function(r){ return r.stockLoss>0.06; })[0];
  if(so) add('warn','Блюда заканчиваются','Из-за стоп-листа потеряно '+pct(so.stockLoss)+' заказов в «'+CITIES[so.city].n+'». Увеличьте запас.','stock');
  var weakDim=null; live.forEach(function(r){ if(!r.dims) return; ['food','svc','cln','atmo','val'].forEach(function(k){ if(!weakDim || r.dims[k]<weakDim.v) weakDim={k:k, v:r.dims[k], r:r}; }); });
  if(weakDim && weakDim.v<55){ var names={food:'Вкус блюд',svc:'Сервис',cln:'Чистота',atmo:'Уют',val:'Цена и качество'}, tips={food:'Нужен более сильный повар, свежие продукты или лучше блюда.',svc:'Нужно больше официантов, обучение или меньше загрузки.',cln:'Нужен сотрудник на уборку и мойку.',atmo:'Поможет ремонт, музыка и террасы.',val:'Цены выше рынка: гости считают порции дорогими.'}; add('warn',names[weakDim.k]+' тянет рейтинг вниз',tips[weakDim.k]+' Сейчас '+Math.round(weakDim.v)+' из 100.','rating'); }
  if(s.tax==='6' && R.tax15<R.tax6*0.85) add('info','Режим 15% был бы выгоднее','Налог на «доходах минус расходах» был бы '+rub(R.tax15)+' вместо '+rub(R.tax6)+'. Решение принимается в сцене с Эммой Григорьевной.','simple');
  var dogs=[]; live.forEach(function(r){ r.mix.forEach(function(m){ if(m.cls==='dog' && m.qty>0 && !m.loc) dogs.push(m.name); }); });
  if(dogs.length) add('info','Кандидаты на вылет','Блюда, которые мало продаются и мало зарабатывают: '+dogs.slice(0,3).join(', ')+'. Освободите место в меню.','menueng');
  if(R.interest>0 && R.interest>t.rev*0.03) add('warn','Проценты по долгам','На проценты ушло '+rub(R.interest)+'. Если денег хватает, часть долга можно погасить.','loan');
  if(t.delComm>t.rev*0.04) add('info','Комиссия доставки','Сервис доставки забрал '+rub(t.delComm)+'. Свои курьеры и упаковка снижают комиссию.','commission');
  return out.slice(0,6);
}

/* «Золотая вилка»: оценка выбранного заведения по последнему месяцу */
function forkScore(s){
  var oid=s.flags.forkOutlet||flagship(s).id, last=s.lastR2||s.lastR, r=last&&last.outlets.filter(function(x){ return x.id===oid; })[0];
  var o=outletById(s,oid)||flagship(s);
  if(!r||!r.dims) return {score:stars(o.rep)*15, tier:'none', name:o.nm};
  var d=r.dims, v=0.40*d.food+0.25*d.svc+0.15*d.cln+0.10*d.atmo+0.10*d.val+s.recs.length*0.8+s.hq.brand*0.06;
  return {score:v, tier:v>=74?'gold':(v>=65?'silver':(v>=56?'bronze':'none')), name:o.nm, dims:d};
}
var FORK_NAMES = {gold:'Золотая вилка', silver:'Серебряная вилка', bronze:'Рекомендация гида', none:'Без награды'};

/* итоговое звание партии */
function verdict(s){
  var g=goalNow(s), fork=forkScore(s), met=goalMet(s);
  if(s.bankrupt) return {id:'bankrupt', name:'Закрытые двери', text:'Кафе пришлось закрыть: долги оказались больше возможностей. Это не конец: опыт стоит дорого, а ваши записи остаются.'};
  if(met && fork.tier==='gold') return {id:'legend', name:'Легенда «Первого столика»', text:'Карта Тамары собрана, гид признал вас, а в каждом городе стоит столик, за которым ждут. Тамара гордилась бы вами.'};
  if(met) return {id:'network', name:'Сеть мечты', text:'Вы построили сеть заведений в разных городах и удержали рейтинг. Цель достигнута.'};
  if(g.cities>=3 && g.cap>=DIFFS[s.diff].cap*0.6) return {id:'growing', name:'Растущая сеть', text:'Сеть уже работает в нескольких городах. До цели чуть-чуть не хватило, но дорога выбрана верно.'};
  if(g.cities>=3) return {id:'young', name:'Молодая сеть', text:'Заведения открыты в '+g.cities+' городах, но расходы на запуск ещё не окупились и капитала мало. Дайте сети время или погасите долги.'};
  if(g.cities>=2) return {id:'two', name:'Два города', text:'У вас два города и твёрдая основа. Для сети нужно больше времени и денег, но это сильное начало.'};
  if(g.cap>=800000) return {id:'cafe', name:'Любимое кафе города', text:'Одно кафе, но какое: гости идут издалека. Сеть можно строить и дальше.'};
  return {id:'first', name:'Первые шаги', text:'Вы дошли до конца пути. Теперь знаете, где терялись деньги и гости, и сможете сыграть лучше.'};
}
function mainLesson(s){
  var h=s.hist, arr=[];
  var best=h.reduce(function(a,b){ return (b.profit>a.profit)?b:a; }, h[0]||{profit:0,m:1}), worst=h.reduce(function(a,b){ return (b.profit<a.profit)?b:a; }, h[0]||{profit:0,m:1});
  return {best:best, worst:worst};
}

function resultLine(s){

}
function parseResults(text){
  var rows=[]; String(text||'').split(/\r?\n/).forEach(function(line){ line=line.trim(); if(!line) return; var p=line.split('|').map(function(x){ return x.trim(); }); if(p.length<8) return; var g=function(re){ var m=line.match(re); return m?m[1]:''; };
    rows.push({name:p[0], cafe:p[1].replace(/^кафе «|»$/g,''), diff:p[3], month:g(/месяц (\d+)/), cap:+g(/капитал (-?\d+)/), cities:+g(/города (\d+)/), rating:g(/рейтинг ([\d,]+)/), goal:/цель достигнута/.test(line), fork:p[p.length-5]||'', ach:g(/награды (\d+)/)}); });
  rows.sort(function(a,b){ return (b.goal-a.goal)||(b.cities-a.cities)||(b.cap-a.cap); });
  return rows;
}

var RUSH_ST=[{id:'coffee',n:'Кофе',g:'cup',cat:'coffee'},{id:'soup',n:'Суп',g:'bowl',cat:'soup'},{id:'main',n:'Горячее',g:'plate',cat:'main'},{id:'dess',n:'Десерт',g:'cake',cat:'dess'}];
function startRush(){
  U.rush={t0:Date.now(), dur:24000, q:[], served:0, miss:0, wrong:0, nid:0, next:0, done:false}; U.screen='rush'; render();
  if(reduced){ U.rush.dur=16000; }

function rushHTML(){
  var R=U.rush; if(!R) return '';
  return '<article class="rush"><div class="scene-head"><span class="chip warn">'+ico('bolt','sm')+' Час пик</span></div><h2>Заказы летят!</h2><p class="muted">Первый заказ в очереди сверху. Нажимайте на станцию, которая его готовит. Не дайте заказам остыть.</p><div class="timer" role="timer" aria-label="Осталось времени"><i id="rk-t"></i></div>'+
   '<div class="tickets" id="rk-q" aria-live="off"></div><div class="station" id="rk-s">'+RUSH_ST.map(function(s){ return '<button data-act="rushpick" data-st="'+s.id+'" aria-label="'+s.n+'">'+dishSVG(s.g,s.cat,34)+s.n+'</button>'; }).join('')+'</div>'+
   '<div class="row between"><span class="chip gain" id="rk-ok">Подано: 0</span><span class="chip loss" id="rk-bad">Ошибки: 0</span><button class="btn ghost small" data-act="rushskip">Бросить смену</button></div></article>';
}
function rushDraw(){
  var R=U.rush, q=$('#rk-q'); if(!R||!q) return;
  q.innerHTML=R.q.map(function(t,i){ var st=RUSH_ST.filter(function(s){ return s.id===t.st; })[0], left=clamp(1-(Date.now()-t.at)/t.life,0,1); return '<div class="tk'+(i===0?' first':'')+'">'+dishSVG(st.g,st.cat,38)+'<div class="small"><b>'+st.n+'</b></div><div class="tm"><i style="width:'+(left*100).toFixed(0)+'%"></i></div></div>'; }).join('')||'<span class="muted small">Ждём заказов…</span>';
  var tt=$('#rk-t'); if(tt) tt.style.width=(clamp(1-(Date.now()-R.t0)/R.dur,0,1)*100)+'%';
  setText('rk-ok','Подано: '+R.served); setText('rk-bad','Ошибки: '+(R.miss+R.wrong));
}
function rushTick(){
  var R=U.rush; if(!R||R.done||U.screen!=='rush'){ clearInterval(U.rushT); U.rushT=0; return; }
  var now=Date.now(), el=now-R.t0;
  if(el>=R.dur){ finishRush(); return; }
  if(now>=R.next && R.q.length<5){ R.q.push({id:R.nid++, st:RUSH_ST[Math.floor(Math.random()*4)].id, at:now, life:6200}); R.next=now+1250+Math.random()*700; }
  R.q=R.q.filter(function(t){ if(now-t.at>t.life){ R.miss++; return false; } return true; });
  rushDraw();
}
A.rushpick=function(el){
  var R=U.rush; if(!R||R.done) return; var st=el.getAttribute('data-st'), first=R.q[0]; if(!first){ R.wrong++; sfx('bad'); return rushDraw(); }
  if(first.st===st){ R.q.shift(); R.served++; sfx('coin'); } else { R.wrong++; sfx('bad'); }
  rushDraw();
};
A.rushskip=function(){ finishRush(); };
function finishRush(){
  var R=U.rush; R.done=true; clearInterval(U.rushT); U.rushT=0;
  var err=R.miss+R.wrong, gr=(R.served>=12&&err<=2)?'gold':((R.served>=8&&err<=5)?'silver':'bronze');
  var fx=gr==='gold'?{c:9000,repOne:3,awr:0.04,mor:3}:(gr==='silver'?{c:3000,repOne:1}:{repOne:-2,mor:-2});
  var chips=applyFx(S,fx), txt={gold:'Золотая смена! Гости аплодируют, шеф кивает.',silver:'Справились. Не идеально, но очередь рассосалась.',bronze:'Было тяжело. Часть заказов остыла.'}[gr];
  U.evRes={t:U.evGame?U.evGame.t:'Смена',res:[txt+' Подано '+R.served+', ошибок '+err+'.'],fx:chips}; U.rush=null; U.screen='event'; sfx(gr==='bronze'?'bad':'win'); if(gr==='gold') burst(70); persist(); render();
}

var FIFO_P=[['Молоко','glass','cold'],['Сливки','glass','cold'],['Творог','bowl','brek'],['Мясо','plate','main'],['Зелень','salad','salad'],['Рыба','fish','main'],['Яйца','egg','brek'],['Масло','cake','dess'],['Ягоды','icecream','dess'],['Тесто','bread','bake'],['Кефир','glass','cold'],['Сметана','bowl','soup']];
function fifoRound(){ var g=U.mg, names=FIFO_P.slice().sort(function(){ return Math.random()-0.5; }).slice(0,6), days=[1,2,3,4,5,6,7,8,9].sort(function(){ return Math.random()-0.5; }).slice(0,6); g.items=names.map(function(n,i){ return {n:n[0],g:n[1],c:n[2],d:days[i],taken:false}; }); }
function fifoHTML(){
  var g=U.mg; if(!g) return '';
  return '<article class="mg"><div class="scene-head"><span class="chip warn">'+ico('bolt','sm')+' Склад · круг '+(g.round+1)+' из 3</span></div><h2>Первым выдаём то, что раньше испортится</h2><p class="muted">Нажимайте на ящик с самым коротким сроком годности. Ошибок: <b id="mg-w">'+g.wrong+'</b></p><div class="crates">'+g.items.map(function(x,i){ return '<button class="crate'+(x.taken?' gone':'')+'" data-act="fifopick" data-i="'+i+'"'+(x.taken?' disabled':'')+' aria-label="'+x.n+', годен '+x.d+' дн.">'+dishSVG(x.g,x.c,44)+'<b>'+x.n+'</b><span class="chip '+(x.d<=2?'loss':(x.d<=4?'warn':'gain'))+'">годен '+x.d+' '+plural(x.d,'день','дня','дней')+'</span></button>'; }).join('')+'</div><div class="row between"><span class="small muted">Это правило FIFO: первым пришёл — первым ушёл.</span><button class="btn ghost small" data-act="mgskip">Бросить</button></div></article>';
}
A.fifopick=function(el){
  var g=U.mg; if(!g) return; var i=+el.getAttribute('data-i'), it=g.items[i]; if(!it||it.taken) return;
  var mn=Math.min.apply(null,g.items.filter(function(x){ return !x.taken; }).map(function(x){ return x.d; }));
  if(it.d===mn){ it.taken=true; g.right++; sfx('coin'); } else { g.wrong++; sfx('bad'); toast('Этот ящик ещё может подождать: сначала то, что скоро испортится.',true); }
  if(g.items.every(function(x){ return x.taken; })){ g.round++; if(g.round>=3){ finishMini('fifo'); return; } fifoRound(); }
  render(true);
};
function changeRound(){ var g=U.mg, total=70+Math.floor(Math.random()*880), bills=[100,200,500,1000,2000,5000], paid=bills.filter(function(b){ return b>=total; })[0]||5000; if(paid-total>1500) paid=bills.filter(function(b){ return b>=total && b-total<=1500; })[0]||paid; var ans=paid-total; var opts=[ans, ans+10*(1+Math.floor(Math.random()*5)), Math.max(5,ans-10*(1+Math.floor(Math.random()*5))), Math.abs(ans-100)||ans+100].filter(function(v,i,a){ return a.indexOf(v)===i; }).slice(0,3); if(opts.indexOf(ans)<0) opts[0]=ans; opts=opts.sort(function(){ return Math.random()-0.5; }); g.q={total:total,paid:paid,ans:ans,opts:opts}; g.picked=null; }
function changeHTML(){

function sparkSVG(vals,labels){
  var W=300,H=84,pad=14, mn=Math.min.apply(null,vals.concat([0])), mx=Math.max.apply(null,vals.concat([1])), n=vals.length;

  var pts=vals.map(function(v,i){ return X(i).toFixed(1)+','+Y(v).toFixed(1); }).join(' '), z=Y(0).toFixed(1);
  var area=X(0).toFixed(1)+','+z+' '+pts+' '+X(n-1).toFixed(1)+','+z;
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="График: '+vals.map(function(v){ return rubk(v); }).join(', ')+'"><line class="g" x1="'+pad+'" x2="'+(W-pad)+'" y1="'+z+'" y2="'+z+'"/><polygon class="f" points="'+area+'"/><polyline class="a" points="'+pts+'"/>'+vals.map(function(v,i){ return '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.6" fill="var(--surface)" stroke="var(--brand)" stroke-width="2.2"/>'; }).join('')+labels.map(function(l,i){ return '<text x="'+X(i)+'" y="'+(H-4)+'" text-anchor="middle">'+l+'</text>'; }).join('')+'</svg>';
}

  var cal=CAL[S.month-1]; if(d.h){ var fh=SEASONF.hot[cal]; a+=chip(fh>=1.15?'gain':(fh<0.8?'loss':'info'), fh>=1.15?'сейчас сезон':(fh<0.8?'не сезон':'летнее')); } if(d.c){ var fc=SEASONF.cold[cal]; a+=chip(fc>=1.15?'gain':(fc<0.8?'loss':'info'), fc>=1.15?'сейчас сезон':(fc<0.8?'не сезон':'зимнее')); } if(o.special===d.id) a+=chip('warn','блюдо дня'); if(d.sig) a+=chip('brand','из тетради'); if(d.need&&!o.std&&!hasEq(o,d.need)) a+=chip('loss','нужна '+(d.need==='oven'?'печь':'гриль'));

};
A.showcode=function(){ openModal('Код сохранения','<p class="small muted">Скопируйте код и вставьте его на другом устройстве в «Загрузить код».</p><textarea class="code" readonly id="savecode">'+esc(exportCode())+'</textarea><div class="row"><button class="btn small secondary" data-act="copycode">'+ico('copy')+' Скопировать</button></div>'); };
A.loadcode=function(){ openModal('Загрузить код','<p class="small muted">Вставьте код, который вы получили в конце первого урока.</p><textarea class="code" id="loadcode" aria-label="Код" placeholder="Вставьте код"></textarea><div class="row"><button class="btn small" data-act="loadgo">Загрузить</button></div>'); };
A.loadgo=function(){ var v=($('#loadcode')||{}).value||''; if(importCode(v)){ closeModal(); hudPrev={}; U.screen=U.screen==='title'?'plan':U.screen; persist(); render(); toast('Игра загружена'); } else toast('Не получилось прочитать код',true); };
A.teacher=function(){ closeModal(); U.screen='teacher'; render(); };
A.tcbuild=function(){ U.teacherText=($('#tc-in')||{}).value||''; render(true); };
A.totitle=function(){ closeModal(); clearTimers(); if(S) persist(); S=null; hudPrev={}; U={screen:'title'}; render(); };
A.continue=function(){ var d=readSave(); if(!d){ toast('Сохранения нет',true); return; } applySave(d); hudPrev={}; render(); };
A.newgame=function(){ var sv=readSave(); if(sv&&U.screen==='title'&&!U.confirmNew){ openModal('Начать заново?','<p>Сохранённая партия (месяц '+Math.min(sv.S.month,TOTAL)+') будет заменена новой.</p><div class="row"><button class="btn" data-act="newgameyes">Начать новую</button><button class="btn secondary" data-act="closemodal">Отмена</button></div>'); return; } A.newgameyes(); };
A.newgameyes=function(){ closeModal(); lsDel(KEY); S=null; hudPrev={}; U={screen:'intro',intro:0,setup:{name:'',cafe:'Первый столик',code:'',talent:'cook',diff:'norm'}}; render(); };
A.tointro=function(){ U.screen='intro'; render(); };
A.introskip=function(){ U.screen='setup'; render(); }; A.intronext=function(){ if(U.intro>=INTRO.length-1) U.screen='setup'; else U.intro++; render(); };
A.settalent=function(el){ readSetup(); U.setup.talent=el.getAttribute('data-v'); render(true); }; A.setdiff=function(el){ readSetup(); U.setup.diff=el.getAttribute('data-v'); render(true); };
function readSetup(){ var st=U.setup||(U.setup={}); var a=$('#f-name'), b=$('#f-cafe'), c=$('#f-code'); if(a) st.name=a.value; if(b) st.cafe=b.value; if(c) st.code=c.value; }
A.startgame=function(){
  readSetup(); var st=U.setup, name=(st.name||'').trim()||'Хозяин', cafe=(st.cafe||'').trim()||'Первый столик', code=(st.code||'').trim();
  var seed=code?('cls:'+code.toLowerCase()):randomSeed();
  S=newState({name:name,cafe:cafe,talent:st.talent,diff:st.diff,code:code,seed:seed}); S.awn=st.awn||'#D1361A'; hudPrev={};
  U={seen:{},actSeen:{},tab:'home'}; enterMonth();
};
A.togglesound=function(){ soundOn=!soundOn; lsSet(SND_KEY,soundOn?'1':'0'); if(soundOn) sfx('good'); renderTools(); };
A.toggletheme=function(){ var d=isDark(); document.documentElement.setAttribute('data-theme',d?'light':'dark'); lsSet(THEME_KEY,d?'light':'dark'); renderTools(); };
A.closemodal=function(){ closeModal(); }; A.modalbg=function(el,ev){ if(ev.target===el) closeModal(); };
A.skipnav=function(ev){ var s=$('#stage'); if(s){ s.focus(); } };

/* ---------- прорисовка ---------- */
function renderTools(){
  var t=$('#tools'); if(!t) return;
  t.innerHTML='<button class="iconbtn '+(soundOn?'on':'')+'" data-act="togglesound" aria-pressed="'+soundOn+'" aria-label="Звук: '+(soundOn?'включён':'выключен')+'">'+ico(soundOn?'sound':'mute')+'</button><button class="iconbtn" data-act="toggletheme" aria-label="Сменить тему оформления">'+ico(isDark()?'sun':'moon')+'</button><button class="iconbtn" data-act="menu" aria-label="Меню игры">'+ico('menu')+'</button>';
}
function stageHTML(){
  switch(U.screen){
    case 'title': return titleHTML(); case 'intro': return introHTML(); case 'setup': return setupHTML(); case 'act': return actHTML(); case 'last': return lastHTML();
    case 'scene': return sceneHTML(); case 'event': return eventHTML(); case 'rush': return rushHTML(); case 'fifo': return fifoHTML(); case 'change': return changeHTML();
    case 'plan': return planHTML(); case 'run': return runHTML(); case 'report': return reportHTML(); case 'quiz': return quizHTML();
    case 'lessonEnd': return lessonEndHTML(); case 'finale': return finaleHTML(); case 'final': return finalHTML(); case 'teacher': return teacherHTML();
  }
  return '';
}
function renderBar(){
  var b=$('#actionbar'), tb=$('#tabbar'); if(!b||!tb) return;
  var plan=S&&U.screen==='plan';
  if(!plan){ b.hidden=true; b.innerHTML=''; tb.hidden=true; tb.innerHTML=''; document.documentElement.style.setProperty('--bar-h','0px'); return; }
  tb.hidden=false; tb.innerHTML=navHTML();
  var R=getPV(), p=R?R.profit:0;
  b.hidden=false; b.innerHTML='<div class="in"><div class="fc"><small>Прогноз прибыли</small><b class="num '+(p>=0?'gain-t':'loss-t')+'">'+sgn(Math.round(p/1000)*1000).replace(/ ₽$/,'')+' ₽</b></div><button class="btn" data-act="go">'+ico('play')+' Запустить месяц</button></div>';
  var h=(b.offsetHeight||70)+(window.innerWidth<900?(tb.offsetHeight||64):0); document.documentElement.style.setProperty('--bar-h',h+'px');
}
function render(keep){
  if(!keep) clearTimers();
  var st=$('#stage'); if(!st) return;
  var y=window.scrollY; st.className='stage'+(keep?' noanim':'');
  st.innerHTML=stageHTML();
  renderHud(); renderTools(); renderBar();
  if(U.screen==='run') runAnim();
  if(U.screen==='rush'){ rushDraw(); }
  if(U.screen==='teacher'){ var ta=$('#tc-in'); if(ta&&U.teacherText) ta.value=U.teacherText; }
  if(S) persist();
  if(keep) window.scrollTo(0,y); else { window.scrollTo(0,0); if(U.screen!=='title') { try{ st.focus({preventScroll:true}); }catch(e){} } }
}

/* ---------- запуск ---------- */
function boot(){
  var th=lsGet(THEME_KEY); if(th) document.documentElement.setAttribute('data-theme',th);
  soundOn=lsGet(SND_KEY)==='1'; U={screen:'title'}; S=null; render();
  window.__game={get S(){ return S; }, get U(){ return U; }, A:A, render:render, enterMonth:enterMonth, toPlan:toPlan, setState:function(s,u){ S=s; U=u; render(); }};
  document.addEventListener('click',function(ev){
    var el=ev.target.closest?ev.target.closest('[data-act]'):null; if(!el) return;
    var act=el.getAttribute('data-act'); if(!A[act]) return; if(el.tagName==='INPUT') return;
    if(act!=='modalbg'||ev.target===el){ A[act](el,ev); }
  });
  document.addEventListener('input',function(ev){ var el=ev.target; if(el&&el.getAttribute&&el.getAttribute('data-act')==='prange') A.prange(el); });
  document.addEventListener('change',function(ev){ var el=ev.target; if(el&&el.getAttribute&&el.getAttribute('data-act')==='prange'){ persist(); render(true); } });
  document.addEventListener('keydown',function(ev){
    if((ev.key==='Enter'||ev.key===' ')&&ev.target&&ev.target.classList&&ev.target.classList.contains('pin')){ ev.preventDefault(); A.mapcity(ev.target); }
    if(ev.key==='Escape'&&$('#modal .modal')) closeModal();
  });
  (function(){ var lastY=0, ticking=false; window.addEventListener('scroll',function(){ if(ticking) return; ticking=true; window.requestAnimationFrame(function(){ ticking=false; if(window.innerWidth>900){ document.body.classList.remove('hud-away'); lastY=window.scrollY; return; } var y=window.scrollY; if(y>lastY+10&&y>220) document.body.classList.add('hud-away'); else if(y<lastY-10||y<120) document.body.classList.remove('hud-away'); lastY=y; }); },{passive:true}); })();
  window.addEventListener('resize',function(){ setHudVar(); renderBar(); });
  window.__appBack=function(){ if($('#modal .modal')){ closeModal(); return true; } if(!S||U.screen==='title') return false; if(U.screen==='teacher'){ U={screen:'title'}; S=null; render(); return true; } persist(); U={screen:'title'}; S=null; hudPrev={}; render(); toast('Прогресс сохранён: нажмите «Продолжить»'); return true; };
}
boot();

})();
document.getElementById('logo').innerHTML = logoSVG(36);
</script>
