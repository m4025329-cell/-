<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Мерч-Империя</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Раскладка: липкая шапка с показателями, под ней одна «сцена» (событие, планирование, итоги).
   Тема: мятная бумага и тёмные чернила, толстые контуры и жёсткие тени, монета-жёлтый как единственный акцент. */
:root{
  --ground:#E2F3EA; --surface:#FFFFFF; --surface-2:#F1F9F5; --ink:#10202E; --muted:#475D6D;
  --line:#10202E; --shadow:#10202E; --coin:#FFC83D; --coin-ink:#10202E; --coin-deep:#F2A900;
  --gain-bg:#C8F0DC; --gain-fg:#07663F; --loss-bg:#FFD9DA; --loss-fg:#B3202A;
  --info-bg:#DCE3FF; --info-fg:#2B3FC2; --grid:#C5DBCF; --track:#CFE5D9;
  --font-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --bw:2.5px; --off:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A1520; --surface:#13273A; --surface-2:#1A3348; --ink:#E9F5EF; --muted:#9DB5C6;
    --line:#5D88AB; --shadow:#030A10; --coin:#FFC83D; --coin-ink:#10202E; --coin-deep:#F2A900;
    --gain-bg:#12402F; --gain-fg:#6CE7AB; --loss-bg:#4A1D26; --loss-fg:#FF9A9E;
    --info-bg:#1F2A66; --info-fg:#A9B8FF; --grid:#26435A; --track:#244158; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0A1520; --surface:#13273A; --surface-2:#1A3348; --ink:#E9F5EF; --muted:#9DB5C6;
  --line:#5D88AB; --shadow:#030A10; --coin:#FFC83D; --coin-ink:#10202E; --coin-deep:#F2A900;
  --gain-bg:#12402F; --gain-fg:#6CE7AB; --loss-bg:#4A1D26; --loss-fg:#FF9A9E;
  --info-bg:#1F2A66; --info-fg:#A9B8FF; --grid:#26435A; --track:#244158; color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font:16px/1.5 var(--font-body);
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:22px 22px}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--info-fg);outline-offset:2px}

.wrap{max-width:1040px;margin-inline:auto;padding-inline:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:1.05rem;letter-spacing:-.02em;white-space:nowrap}
.logo-coin{width:34px;height:34px;border-radius:50%;background:var(--coin);border:var(--bw) solid var(--line);box-shadow:2px 2px 0 var(--shadow);display:grid;place-items:center;color:var(--coin-ink);font-size:.95rem}
.tools{display:flex;gap:8px}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;box-shadow:2px 2px 0 var(--shadow);cursor:pointer;color:var(--ink);padding:0}
.iconbtn:hover{background:var(--coin);color:var(--coin-ink)}
.iconbtn:active{transform:translate(2px,2px);box-shadow:none}
.iconbtn svg{width:20px;height:20px}

/* ШАПКА С ПОКАЗАТЕЛЯМИ */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:8px;background:linear-gradient(var(--ground) 80%,transparent)}
.hud-card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--off) var(--off) 0 var(--shadow);padding:12px 14px;display:grid;gap:10px}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hud-month{font-family:var(--font-display);font-weight:700;font-size:1rem}
.hud-sub{font-size:.8rem;color:var(--muted)}
.pips{display:flex;gap:3px;flex-wrap:nowrap}
.pip{width:12px;height:12px;border-radius:3px;background:var(--track);border:1.5px solid var(--line)}
.pip.done{background:var(--ink)}
.pip.now{background:var(--coin)}
.pip.gap{margin-left:7px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{min-width:0}
.stat b{display:block;font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat span{display:block;font-family:var(--font-display);font-weight:700;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.neg span{color:var(--loss-fg)}
.goalbar{height:14px;background:var(--track);border:2px solid var(--line);border-radius:99px;overflow:hidden}
.goalbar i{display:block;height:100%;background:repeating-linear-gradient(135deg,var(--coin) 0 8px,var(--coin-deep) 8px 16px);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.goalrow{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);gap:8px}

/* ОБЩИЕ ЭЛЕМЕНТЫ */
.stage{padding-block:12px 40px;display:grid;gap:16px;min-width:0}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--off) var(--off) 0 var(--shadow);padding:18px;min-width:0}
.card.flat{box-shadow:none;background:var(--surface-2)}
.card h2{font-size:1.25rem}
.card h3{font-size:1rem}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;background:var(--surface);color:var(--ink);border:var(--bw) solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--shadow);font-weight:700;cursor:pointer;text-align:center;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.primary{background:var(--coin);color:var(--coin-ink);font-family:var(--font-display);font-size:.95rem;font-weight:700}
.btn.small{min-height:38px;padding:6px 12px;font-size:.85rem;box-shadow:2px 2px 0 var(--shadow)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.82rem;font-weight:600;border:2px solid var(--line);background:var(--surface-2)}
.chip.gain{background:var(--gain-bg);color:var(--gain-fg)}
.chip.loss{background:var(--loss-bg);color:var(--loss-fg)}
.chip.info{background:var(--info-bg);color:var(--info-fg)}
.chip.coin{background:var(--coin);color:var(--coin-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.gain-t{color:var(--gain-fg)} .loss-t{color:var(--loss-fg)}
.ico{width:1em;height:1em;flex:none}

/* ЗАСТАВКА */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center}
.hero h1{font-size:clamp(2rem,6.4vw,3.6rem);font-weight:800}
.hero h1 em{font-style:normal;background:var(--coin);color:var(--coin-ink);padding:0 .15em;border-radius:8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:46ch;margin-top:14px}
.hero-art{display:grid;place-items:center}
.hero-art svg{width:100%;max-width:380px;height:auto}
.field{display:grid;gap:6px;margin-top:20px}
.field label{font-weight:700;font-size:.9rem}
.field input{min-height:50px;padding:10px 14px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;box-shadow:inset 3px 3px 0 var(--grid)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.howto .card{padding:14px}
.step-n{width:30px;height:30px;border-radius:50%;background:var(--coin);color:var(--coin-ink);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:.85rem;margin-bottom:8px}
.lessons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lessons .card{padding:14px}
.lessons ul{margin:6px 0 0;padding-left:1.1em;color:var(--muted);font-size:.9rem}

/* СОБЫТИЕ */
.event{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
.badge-ico{width:84px;height:84px;border-radius:50%;background:var(--coin);color:var(--coin-ink);border:var(--bw) solid var(--line);box-shadow:var(--off) var(--off) 0 var(--shadow);display:grid;place-items:center}
.badge-ico svg{width:44px;height:44px}
.event h2{font-size:clamp(1.3rem,3.6vw,1.9rem);margin:6px 0 10px}
.event .text{font-size:1.04rem;max-width:62ch}
.choices{display:grid;gap:12px;margin-top:6px}
.choice{display:grid;gap:2px;text-align:left;padding:14px 16px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;width:100%}
.choice:hover{background:var(--surface-2);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.choice:active{transform:translate(3px,3px);box-shadow:none}
.choice b{font-size:1.02rem}
.choice span{color:var(--muted);font-size:.9rem}
.choice.picked{background:var(--coin);color:var(--coin-ink)}
.choice.picked span{color:var(--coin-ink)}
.choice.dim{opacity:.5;pointer-events:none}
.lesson{border:var(--bw) dashed var(--line);border-radius:12px;padding:14px 16px;background:var(--info-bg);color:var(--ink)}
.lesson b{color:var(--info-fg)}

/* ПЛАНИРОВАНИЕ */
.tabs{display:flex;gap:6px;padding:6px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:14px;box-shadow:var(--off) var(--off) 0 var(--shadow);width:100%}
.tab{flex:1;min-height:44px;padding:8px 10px;border:0;border-radius:9px;background:transparent;font-weight:700;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--ground)}
.plan{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.ctl-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ctl-val{font-family:var(--font-display);font-weight:800;font-size:1.6rem}
.ctl-note{font-size:.88rem;color:var(--muted);margin-top:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:8px 0 2px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:14px;background:var(--track);border:2px solid var(--line);border-radius:99px}
input[type=range]::-moz-range-track{height:10px;background:var(--track);border:2px solid var(--line);border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-10px;border-radius:50%;background:var(--coin);border:var(--bw) solid var(--line);box-shadow:2px 2px 0 var(--shadow)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--coin);border:var(--bw) solid var(--line);box-shadow:2px 2px 0 var(--shadow)}
.scale{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.adgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.ad{padding:10px 12px;text-align:left;background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;cursor:pointer;display:grid;gap:2px}
.ad[aria-pressed="true"]{background:var(--coin);color:var(--coin-ink);box-shadow:3px 3px 0 var(--shadow)}
.ad b{font-size:.95rem} .ad span{font-size:.8rem;color:var(--muted)} .ad[aria-pressed="true"] span{color:var(--coin-ink)}
.fc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.fc div{background:var(--surface-2);border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.fc b{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fc span{font-family:var(--font-display);font-weight:700;font-size:.98rem;display:block;overflow-wrap:anywhere}
.callout{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--info-bg);font-size:.92rem}
.callout.warn{background:var(--loss-bg)}
.callout.ok{background:var(--gain-bg)}
.callout svg{width:20px;height:20px;flex:none;margin-top:2px}
.curve{width:100%;height:auto;display:block}
.curve text{font-family:var(--font-body);font-size:10.5px;fill:var(--muted)}
.actionbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:15;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--off) var(--off) 0 var(--shadow);padding:10px 14px}
.actionbar .sum{display:grid;font-size:.85rem;color:var(--muted)}
.actionbar .sum b{font-family:var(--font-display);font-size:1.05rem;color:var(--ink)}

/* РАЗВИТИЕ И ФИНАНСЫ */
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.up{display:grid;gap:10px;align-content:space-between}
.up h3{font-size:1.02rem}
.up.owned{background:var(--gain-bg)}
.up.locked{opacity:.6}
.fin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.bal{width:100%;border-collapse:collapse;font-size:.95rem}
.bal td{padding:6px 0;border-bottom:1.5px dashed var(--grid)}
.bal td:last-child{text-align:right;font-weight:700}
.bal tr.total td{border-bottom:0;border-top:var(--bw) solid var(--line);font-family:var(--font-display);font-weight:800;padding-top:10px}
.mv{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.big{font-family:var(--font-display);font-weight:800;font-size:1.5rem}

/* ИТОГИ МЕСЯЦА */
.report-head{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-end}
.profit{font-family:var(--font-display);font-weight:800;font-size:clamp(1.9rem,6vw,3rem)}
.wf{display:grid;gap:8px;margin-top:6px}
.wf-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:.93rem}
.wf-row .bar{grid-column:1/-1;height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.wf-row .bar i{display:block;height:100%;background:var(--ink)}
.wf-row.plus .bar i{background:#19B37A}
.wf-row.minus .bar i{background:#E5484D}
.wf-row b{font-variant-numeric:tabular-nums}
.wf-row.sum{border-top:var(--bw) solid var(--line);padding-top:10px;font-weight:800}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

/* ВИКТОРИНА */
.qopts{display:grid;gap:10px;margin-top:14px}
.qopt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;width:100%;font-weight:600}
.qopt .k{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--font-display);font-size:.8rem;background:var(--surface-2)}
.qopt:hover{background:var(--surface-2)}
.qopt.right{background:var(--gain-bg);color:var(--gain-fg)}
.qopt.wrong{background:var(--loss-bg);color:var(--loss-fg)}
.qopt.dim{opacity:.55;pointer-events:none}
.qprog{display:flex;gap:6px}
.qprog i{flex:1;height:8px;border-radius:99px;background:var(--track);border:1.5px solid var(--line)}
.qprog i.on{background:var(--ink)}

/* ФИНАЛ */
.final-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.rank{font-family:var(--font-display);font-weight:800;font-size:clamp(1.7rem,5vw,2.6rem)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.bdg{display:flex;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface-2)}
.bdg.on{background:var(--coin);color:var(--coin-ink)}
.bdg.off{opacity:.55}
.bdg svg{width:26px;height:26px;flex:none}
.bdg small{display:block;font-size:.76rem;opacity:.85;line-height:1.3}
.code{width:100%;min-height:76px;resize:vertical;padding:10px 12px;background:var(--surface-2);border:var(--bw) solid var(--line);border-radius:12px;font-family:var(--font-mono);font-size:.82rem}

/* МОДАЛКА / ТОСТ */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,12,18,.62);display:grid;place-items:center;padding:16px}
.modal-box{width:min(680px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:6px 6px 0 var(--shadow);padding:20px;display:grid;gap:14px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.terms{display:grid;gap:10px}
.term{padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface-2)}
.term b{display:block}
.term span{color:var(--muted);font-size:.92rem}
.term.lock{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:3px 3px 0 var(--shadow);animation:pop .25s ease}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.stage.enter>*{animation:rise .35s ease both}
.stage.enter>*:nth-child(2){animation-delay:.05s}.stage.enter>*:nth-child(3){animation-delay:.1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bob{animation:bob 3.2s ease-in-out infinite}
.bob.d2{animation-delay:-1.2s}.bob.d3{animation-delay:-2.1s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ПЛАНШЕТ И ТЕЛЕФОН */
@media (max-width:860px){
  .hero,.plan,.final-top,.two{grid-template-columns:minmax(0,1fr)}
  .hero-art{order:-1}.hero-art svg{max-width:240px}
  .howto,.lessons{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .stat b{font-size:.58rem;letter-spacing:.03em}
  .stat span{font-size:.74rem}
  .hud{padding-block:4px}
  .hud-card{gap:6px}
  .pips,.hud-sub,.goalrow span:first-child{display:none}
  .goalrow{justify-content:flex-end;margin-top:2px}
  .goalbar{height:10px}
  .event{grid-template-columns:minmax(0,1fr)}
  .badge-ico{width:64px;height:64px}.badge-ico svg{width:34px;height:34px}
  .pip{width:9px;height:9px}
  .logo span.t{font-size:.95rem}
  .fc{grid-template-columns:minmax(0,1fr)}
  .actionbar{flex-direction:column;align-items:stretch}
  .actionbar .btn{width:100%}
  .hud-card{padding:10px 12px}
  .card{padding:14px}
  .adgrid{grid-template-columns:minmax(0,1fr)}
}

</style>
<div class="wrap">
  <header class="topbar">
    <div class="logo"><span class="logo-coin">₽</span><span class="t">Мерч-Империя</span></div>

<script>
/* ===== Экономический движок «Мерч-Империи» (без интерфейса) ===== */

var GOAL = 1000000, TOTAL = 16, START_CASH = 30000, ELASTICITY = 1.7, BASE_COST = 350, BASE_PRICE = 900, D0 = 55;
var MONTH_NAMES = ['Сентябрь','Октябрь','Ноябрь','Декабрь','Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var SEASON = [1.0,1.0,1.2,1.4,0.75,1.05,1.2,1.0,1.0,1.1,0.85,1.15,1.0,1.0,1.2,1.4];
var AD = [
  {name:'Без рекламы', cost:0, mult:1, brand:0},
  {name:'Соцсети', cost:3000, mult:1.10, brand:1.5},
  {name:'Блогеры', cost:8000, mult:1.22, brand:3},
  {name:'Большая кампания', cost:20000, mult:1.32, brand:5}
];
var UPGRADES = [
  {id:'press', name:'Термопресс PRO', cost:25000, from:1, desc:'Печатает быстрее и дешевле.', fx:['+30 футболок в месяц','себестоимость −40 ₽']},
  {id:'online', name:'Интернет-магазин', cost:18000, from:1, desc:'Заказы приходят со всего города.', fx:['спрос ×1,25','комиссия сайта 2 000 ₽/мес']},
  {id:'brandkit', name:'Фирменный стиль', cost:35000, from:5, desc:'Логотип, упаковка, единый вид.', fx:['узнаваемость +10','спрос ×1,08']},
  {id:'designer', name:'Штатный дизайнер', cost:0, from:5, desc:'Новые принты каждую неделю.', fx:['спрос ×1,12','зарплата 20 000 ₽/мес']},
  {id:'workshop', name:'Швейный цех', cost:150000, from:9, desc:'Своё производство вместо гаража.', fx:['+150 футболок в месяц','себестоимость −60 ₽']},
  {id:'line', name:'Автоматическая линия', cost:300000, from:13, desc:'Печать почти без участия людей.', fx:['+300 футболок в месяц','себестоимость −50 ₽']}
];
var TAX_MIN = 0.01;

function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
function newState(name){
  return { name:name||'Предприниматель', month:1, cash:START_CASH, savings:0, fund:0, stock:0,
    inv:0, invValue:0, loanLeft:0, loanStep:0, brand:0, infl:1, costBase:1,
    qualityMult:1, nicheMult:1, store:'none', staffPro:0, staffTeen:0, taxMode:null,
    up:{}, mods:[], price:BASE_PRICE, produce:30, adIdx:0, discount:1,
    unlock:{deposit:false, invest:false, loan:false},
    history:[], quizScore:[], quizTotal:0, badges:{}, terms:[], tookRisk:false, riskWon:false,
    overdrafts:0, lastMargin:0.3, totalRevenue:0, log:[] };
}
function modProd(s, k){ var p=1; s.mods.forEach(function(m){ if(m.k===k) p*=m.m; }); return p; }
function unitCost(s){
  var c = BASE_COST;
  if(s.up.press) c -= 40; if(s.up.workshop) c -= 60; if(s.up.line) c -= 50;
  c += (s.costAdd||0);
  return Math.round(Math.max(120, c) * s.costBase * modProd(s,'cost'));
}
function capacity(s){
  var c = 55;
  if(s.store==='shop') c+=60; if(s.store==='cowork') c+=20;
  if(s.up.press) c+=40; if(s.up.workshop) c+=250; if(s.up.line) c+=450;
  if(s.staffPro) c+=80; if(s.staffTeen) c+=25;
  return c;
}
function refPrice(s){ return Math.round(BASE_PRICE * s.infl * modProd(s,'ref') / 10) * 10; }
function permanentDemand(s){
  var m = s.qualityMult * s.nicheMult;
  if(s.store==='shop') m*=1.3; else if(s.store==='cowork') m*=1.12;
  if(s.up.online) m*=1.25; if(s.up.brandkit) m*=1.08; if(s.up.designer) m*=1.12;
  if(s.staffPro) m*=1.08;
  return m;
}
function demandAt(s, price, adIdx, noise){
  var d = D0 * SEASON[s.month-1] * Math.pow(refPrice(s)/price, ELASTICITY) * AD[adIdx].mult *
          (1 + s.brand*0.012) * permanentDemand(s) * modProd(s,'dem') * (noise||1);
  return Math.max(0, d);
}
function fixedCosts(s){
  var f = 0;
  if(s.store==='shop') f+=15000; if(s.store==='cowork') f+=6000;
  f += s.staffPro*25000*s.infl + s.staffTeen*10000*s.infl;
  if(s.up.designer) f+=20000*s.infl;
  if(s.up.online) f+=2000;
  f = f * modProd(s,'fixed');
  return Math.round(f);
}
function loanPayment(s){
  if(s.loanLeft<=0) return 0;
  return Math.round(Math.min(s.loanLeft, s.loanStep) + s.loanLeft*0.015);
}
function netWorth(s){
  return Math.round(s.cash + s.savings + s.fund + s.stock + s.invValue - s.loanLeft);
}
function planCost(s, plan){
  return plan.produce*unitCost(s) + AD[plan.adIdx].cost;
}
function netProfitPreview(s, plan, demand){
  var c = unitCost(s), avail = s.inv + plan.produce, sold = Math.min(Math.round(demand), avail);
  var priceNow = plan.price * s.discount;
  var rev = sold*priceNow;
  var avg = avail>0 ? (s.invValue + plan.produce*c)/avail : c;
  var cogs = sold*avg;
  var fixed = fixedCosts(s) + (avail-sold)*15 + Math.round(s.loanLeft*0.015);
  var pbt = rev - cogs - AD[plan.adIdx].cost - fixed;
  var tax = calcTax(s, rev, pbt);
  return {sold:sold, revenue:rev, profit:pbt-tax, demand:demand};
}
function calcTax(s, revenue, pbt){
  if(s.taxMode==='rev') return Math.round(revenue*0.06);
  if(s.taxMode==='profit') return Math.round(Math.max(pbt*0.15, revenue*TAX_MIN));
  return 0;
}
function gauss(rng){ return (rng()+rng()+rng()+rng()-2)*1.7; }

function runMonth(s, plan, rng){
  rng = rng || Math.random;
  var c = unitCost(s), cap = capacity(s);
  var produce = clamp(Math.round(plan.produce), 0, cap);
  var price = plan.price, ad = AD[plan.adIdx];
  var r = {month:s.month, produce:produce, price:price, unit:c, ad:ad.cost, discount:s.discount};
  /* закупка и реклама оплачиваются сразу */
  var upfront = produce*c + ad.cost;
  s.cash -= upfront;
  s.inv += produce; s.invValue += produce*c;
  /* спрос */
  var noise = 0.92 + rng()*0.16;
  var D = Math.round(demandAt(s, price, plan.adIdx, noise));
  var sold = Math.min(D, s.inv);
  var avg = s.inv>0 ? s.invValue/s.inv : c;
  var cogs = Math.round(sold*avg);
  var revenue = Math.round(sold*price*s.discount);
  s.inv -= sold; s.invValue = s.inv>0 ? Math.max(0, s.invValue - cogs) : 0;
  r.demand = D; r.sold = sold; r.lost = Math.max(0, D-sold); r.left = s.inv;
  r.revenue = revenue; r.cogs = cogs;
  /* постоянные расходы */
  var fixed = fixedCosts(s), carry = s.inv*15;
  var interest = Math.round(s.loanLeft*0.015), principal = Math.round(Math.min(s.loanLeft, s.loanStep));
  r.fixed = fixed; r.carry = carry; r.interest = interest; r.principal = principal;
  var pbt = revenue - cogs - ad.cost - fixed - carry - interest;
  var tax = calcTax(s, revenue, pbt);
  r.tax = tax; r.profit = pbt - tax;
  s.cash += revenue - fixed - carry - interest - principal - tax;
  s.loanLeft -= principal; if(s.loanLeft<1){ s.loanLeft=0; s.loanStep=0; }
  /* вклады и инвестиции */
  r.depositGain = Math.round(s.savings*0.01); s.savings += r.depositGain;
  var fundR = 0.008 + 0.04*gauss(rng)/1.7*1.0, stockR = 0.012 + 0.13*gauss(rng)/1.7;
  var shock = s.month===15 ? 1 : 0;
  if(shock){ fundR -= 0.10; stockR -= 0.22; }
  fundR = clamp(fundR, -0.25, 0.15); stockR = clamp(stockR, -0.45, 0.30);
  r.fundR = fundR; r.stockR = stockR;
  var fb = s.fund, sb = s.stock;
  s.fund = Math.round(s.fund*(1+fundR)); s.stock = Math.round(s.stock*(1+stockR));
  r.investGain = (s.fund-fb)+(s.stock-sb);
  /* овердрафт */
  r.overdraft = 0;
  if(s.cash<0 && s.savings>0){ var take=Math.min(s.savings, -s.cash); s.savings-=take; s.cash+=take; r.fromSavings=take; }
  if(s.cash<0){ r.overdraft = Math.round(-s.cash); s.loanLeft += r.overdraft; s.loanStep = Math.max(s.loanStep, Math.round(s.loanLeft/12)); s.cash = 0; s.overdrafts++; }
  /* узнаваемость и итоги */
  s.brand = clamp(s.brand*0.97 + ad.brand + (D>0 ? Math.min(3, sold/40) : 0), 0, 100);
  s.lastMargin = revenue>0 ? r.profit/revenue : 0;
  s.totalRevenue += revenue;
  s.mods.forEach(function(m){ m.left--; });
  s.mods = s.mods.filter(function(m){ return m.left>0; });
  s.discount = 1;
  s.history.push({m:s.month, revenue:revenue, profit:r.profit, nw:netWorth(s), sold:sold, cash:s.cash});
  r.nw = netWorth(s);
  s.month++;
  return r;
}
function coverDeficit(s){
  if(s.cash>=0) return 0;
  var d = Math.round(-s.cash);
  s.loanLeft += d; s.loanStep = Math.max(s.loanStep, Math.round(s.loanLeft/12)); s.cash = 0; s.overdrafts++; s.unlock.loan = true;
  return d;
}


/* ===== События, словарик и вопросы ===== */
function rub(n){ n=Math.round(n); var sgn=n<0?'−':''; return sgn+Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₽'; }
function pct(x, d){ return (x*100).toFixed(d||0).replace('.',',')+'%'; }
function cash(s, n, label){ s.cash += n; return {t:(n>=0?'+':'')+rub(n)+(label?' '+label:''), k:n>=0?'gain':'loss'}; }
function mod(s, k, m, left, label){ s.mods.push({k:k, m:m, left:left, label:label}); }
function modChip(txt, good){ return {t:txt, k:good?'gain':'loss'}; }
function addBrand(s, n){ s.brand = clamp(s.brand+n,0,100); return {t:'узнаваемость '+(n>=0?'+':'')+n, k:n>=0?'gain':'loss'}; }

/* ---------- звук и эффекты ---------- */
function tone(freq,dur,delay,type,vol){
  if(!soundOn) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    var t=actx.currentTime+(delay||0), o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'square'; o.frequency.value=freq; g.gain.setValueAtTime(vol||0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function sfx(k){
  if(k==='click') tone(520,0.06,0,'square',0.03);
  else if(k==='coin'){ tone(988,0.08,0,'square',0.05); tone(1319,0.18,0.08,'square',0.05); }
  else if(k==='good'){ tone(523,0.1,0,'triangle',0.08); tone(659,0.1,0.1,'triangle',0.08); tone(784,0.2,0.2,'triangle',0.08); }
  else if(k==='bad'){ tone(220,0.18,0,'sawtooth',0.05); tone(165,0.28,0.15,'sawtooth',0.05); }
  else if(k==='win'){ [523,659,784,1047].forEach(function(f,i){ tone(f,0.2,i*0.12,'triangle',0.09); }); }
}
var fxc=null, parts=[], raf=0;
function burst(n,cx,cy){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  fxc=fxc||$('#fx'); if(!fxc) return;
  var w=fxc.width=innerWidth, h=fxc.height=innerHeight, cols=['#FFC83D','#19B37A','#3B5BFF','#FF5C7A','#FFFFFF'];
  for(var i=0;i<n;i++){ var a=Math.random()*Math.PI*2, v=4+Math.random()*9;
    parts.push({x:cx==null?w/2:cx,y:cy==null?h*0.35:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,r:3+Math.random()*4,c:cols[i%cols.length],life:70+Math.random()*40,rot:Math.random()*6}); }
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  var ctx=fxc.getContext('2d'); ctx.clearRect(0,0,fxc.width,fxc.height);
  parts=parts.filter(function(p){ return p.life>0; });
  parts.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.28; p.vx*=0.985; p.life--; p.rot+=0.2;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.globalAlpha=Math.min(1,p.life/30); ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); ctx.restore(); });
  if(parts.length) raf=requestAnimationFrame(tick); else { raf=0; ctx.clearRect(0,0,fxc.width,fxc.height); }
}

function prepareMonth(){
  var b=bounds(); S.price=clamp(Math.round((S.price||refPrice(S))/10)*10,b.min,b.max);
  S.adIdx=clamp(S.adIdx||0,0,AD.length-1);
  var d=demandAt(S,S.price,S.adIdx,1); S.produce=clamp(Math.round(d)-S.inv,0,capacity(S));
  fitProduce();
}
function fitProduce(){
  var c=unitCost(S), room=Math.floor((S.cash-AD[S.adIdx].cost)/c);
  S.produce=clamp(Math.min(S.produce,room),0,capacity(S));
}

function curveSVG(){
  var b=bounds(), cap=capacity(S), ref=refPrice(S), W=400,H=230,L=42,R=10,T=12,B=34, pw=W-L-R, ph=H-T-B;
  var ymax=Math.max(cap*1.35, demandAt(S,Math.round(ref*1.05),S.adIdx,1)*1.5, 20); ymax=Math.ceil(ymax/10)*10;
  function X(p){ return L+(p-b.min)/(b.max-b.min)*pw; } function Y(d){ return T+ph-Math.min(d,ymax)/ymax*ph; }
  var pts=[],i,p; for(i=0;i<=50;i++){ p=b.min+(b.max-b.min)*i/50; pts.push(X(p).toFixed(1)+','+Y(demandAt(S,p,S.adIdx,1)).toFixed(1)); }
  var d=demandAt(S,S.price,S.adIdx,1), avail=S.inv+S.produce, g='';
  [0,0.5,1].forEach(function(t){ var yy=T+ph-t*ph; g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--grid)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(yy+3.5)+'" text-anchor="end">'+Math.round(ymax*t)+'</text>'; });
  [b.min,Math.round((b.min+b.max)/20)*10,b.max].forEach(function(pp,k){ g+='<text x="'+X(pp)+'" y="'+(H-14)+'" text-anchor="'+(k===0?'start':(k===2?'end':'middle'))+'">'+num(pp)+' ₽</text>'; });
  g+='<text x="'+(L)+'" y="'+(H-2)+'" style="font-size:10px">цена →</text><text x="'+(W-R)+'" y="'+(T+8)+'" text-anchor="end" style="font-size:10px">↑ покупателей в месяц</text>';
  var cl=Math.min(avail,ymax);
  return g+'<line x1="'+X(ref)+'" x2="'+X(ref)+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4" opacity=".5"/>'+
   '<polyline points="'+L+','+(T+ph)+' '+pts.join(' ')+' '+(W-R)+','+(T+ph)+'" fill="var(--info-bg)" stroke="none" opacity=".8"/>'+
   '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--info-fg)" stroke-width="3" stroke-linejoin="round"/>'+
   '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(cl)+'" y2="'+Y(cl)+'" stroke="var(--coin-deep)" stroke-width="2.5" stroke-dasharray="7 5"/>'+
   '<text x="'+(L+4)+'" y="'+(Y(cl)-5)+'" style="fill:var(--ink);font-weight:700">у тебя будет: '+avail+' шт.</text>'+
   '<line x1="'+X(S.price)+'" x2="'+X(S.price)+'" y1="'+Y(d)+'" y2="'+(T+ph)+'" stroke="var(--ink)" stroke-width="1.5"/>'+
   '<circle cx="'+X(S.price)+'" cy="'+Y(d)+'" r="7" fill="var(--coin)" stroke="var(--line)" stroke-width="2.5"/>';
}

  return '<div class="card"><div class="eyebrow">Урок 1 завершён</div><h2 style="margin-top:4px">Половина пути пройдена</h2>'+
   '<p style="margin-top:12px;max-width:60ch">Капитал: <b class="num">'+rub(netWorth(S))+'</b>. Игра сохранена на этом устройстве. На втором уроке открой её на этом же компьютере и нажми «Продолжить». Если компьютер другой, скопируй код ниже и загрузи его на заставке.</p>'+
   '<div class="chips" style="margin-top:14px"><span class="chip gain">'+ico('check')+' Главы 1–2 пройдены</span><span class="chip info">Ответов верно: '+S.quizScore.reduce(function(a,b){return a+b;},0)+' из '+S.quizTotal+'</span></div>'+
   '<h3 style="margin-top:18px">Код сохранения</h3><textarea class="code" id="savecode" readonly>'+code+'</textarea>'+
   '<div class="row" style="margin-top:10px"><button class="btn small" data-act="copysave">Скопировать код</button></div></div>'+
   '<div class="callout">'+ico('book')+'<div><b>Для учителя.</b> Результат ученика: '+esc(resultLine())+'</div></div>'+
   '<div><button class="btn primary" data-act="lessonnext">Продолжить: урок 2</button></div>';
}

/* ---------- финал ---------- */
function badgeList(){
  var nw=netWorth(S), q=S.quizScore.reduce(function(a,b){return a+b;},0);
  var first=S.history[0]&&S.history[0].profit>0;
  return [
   {id:'first',n:'Первая прибыль',d:'Первый месяц закончился в плюсе',ic:'coin',on:!!first},
   {id:'cushion',n:'Подушка безопасности',d:'Вклад и вложения на 50 000 ₽ и больше',ic:'shield',on:S.savings+S.fund+S.stock>=50000},
   {id:'div',n:'Диверсификатор',d:'Деньги и на вкладе, и в ценных бумагах',ic:'chart',on:S.savings>0&&(S.fund>0||S.stock>0)},
   {id:'risk',n:'Рискнул и выиграл',d:'Ролик блогера выстрелил',ic:'dice',on:!!S.riskWon},
   {id:'scholar',n:'Отличник',d:'Все 12 вопросов верно',ic:'grad',on:q===12},
   {id:'free',n:'Без долгов',d:'К концу игры кредитов нет',ic:'check',on:S.loanLeft===0},
   {id:'ctrl',n:'Деньги под контролем',d:'Ни разу не ушёл в овердрафт',ic:'lock',on:S.overdrafts===0},
   {id:'tycoon',n:'Миллион!',d:'Капитал '+rub(GOAL)+' и больше',ic:'star',on:nw>=GOAL}
  ];
}
function resultLine(){
  var q=S.quizScore.reduce(function(a,b){return a+b;},0);
  return S.name+' | месяц '+Math.min(S.month-1,TOTAL)+' из '+TOTAL+' | капитал '+rub(netWorth(S))+' | звание «'+titleOf(netWorth(S))+'» | вопросы '+q+'/'+S.quizTotal;
}
function finalHTML(){
  var nw=netWorth(S), q=S.quizScore.reduce(function(a,b){return a+b;},0), win=nw>=GOAL;
  var bestM=S.history.reduce(function(a,b){ return b.profit>a.profit?b:a; },S.history[0]);
  var h='<div class="card"><div class="final-top"><div><div class="eyebrow">'+(win?'Цель достигнута':'Игра окончена')+'</div><div class="rank" style="margin-top:6px">'+titleOf(nw)+'</div>'+
   '<div class="big num" style="margin-top:6px">'+rub(nw)+'</div><p class="ctl-note">итоговый капитал, цель: '+rub(GOAL)+'</p>'+
   '<div class="chips" style="margin-top:14px"><span class="chip info">Вопросы: '+q+' из '+S.quizTotal+'</span><span class="chip">Выручка за игру: '+rub(S.totalRevenue)+'</span>'+(bestM?'<span class="chip coin">Лучший месяц: '+MONTH_NAMES[bestM.m-1]+', '+rub(bestM.profit)+'</span>':'')+'</div></div>'+
   '<div>'+lineChart(S.history,520,230)+'</div></div></div>';
  h+='<div class="card"><h3>Награды</h3><div class="badges" style="margin-top:12px">'+badgeList().map(function(b){ return '<div class="bdg '+(b.on?'on':'off')+'">'+ico(b.ic)+'<div><b>'+b.n+'</b><small>'+b.d+'</small></div></div>'; }).join('')+'</div></div>';
  h+='<div class="card"><h3>Результат для учителя</h3><textarea class="code" id="resline" readonly>'+esc(resultLine())+'</textarea><div class="row" style="margin-top:10px"><button class="btn small" data-act="copyres">Скопировать</button></div></div>';
  h+='<div class="lesson"><b>Главный вывод.</b> Бизнес — это постоянный выбор между риском и выгодой, расходами и доходами, сегодня и завтра. Игра учила управлять ценой и спросом, платить налоги, брать кредит, защищаться от инфляции и переживать кризис. Это те же решения, что принимают настоящие предприниматели.</div>';
  h+='<div class="row"><button class="btn primary" data-act="restart">Сыграть ещё раз</button><button class="btn" data-act="glossary">Открыть словарик</button></div>';
  return h;
}

/* ---------- модальные окна ---------- */
function openModal(html){ $('#modal').innerHTML='<div class="modal" data-act="closemodal"><div class="modal-box" role="dialog" aria-modal="true">'+html+'</div></div>'; var b=$('#modal .iconbtn,#modal .btn'); if(b) b.focus(); }
function closeModal(){ $('#modal').innerHTML=''; }
function glossaryHTML(){
  var keys=Object.keys(TERMS), got=S?S.terms:[];
  return '<div class="modal-head"><h2>Словарик экономиста</h2><button class="btn small" data-act="closemodal">Закрыть</button></div>'+
   '<p class="ctl-note">Открыто терминов: '+got.length+' из '+keys.length+'. Новые появляются, когда ты встречаешь их в событиях.</p><div class="terms">'+
   keys.map(function(k){ return got.indexOf(k)>=0 ? '<div class="term"><b>'+TERMS[k][0]+'</b><span>'+TERMS[k][1]+'</span></div>' : '<div class="term lock"><b>'+ico('lock')+' Закрытый термин</b><span>Откроется по ходу игры.</span></div>'; }).join('')+'</div>';
}
function loadHTML(){
  return '<div class="modal-head"><h2>Загрузить игру</h2><button class="btn small" data-act="closemodal">Закрыть</button></div>'+
   '<p class="ctl-note">Вставь код сохранения, который был показан в конце прошлого урока.</p><textarea class="code" id="loadcode" placeholder="Вставь код сюда"></textarea><div class="row"><button class="btn primary" data-act="doload">Загрузить</button></div><p class="ctl-note loss-t" id="loaderr"></p>';
}

/* ---------- отрисовка ---------- */
function stageHTML(){
  switch(U.screen){
    case 'title': return titleHTML();
    case 'event': return eventHTML();
    case 'plan': return planHTML();
    case 'report': return reportHTML();
    case 'quiz': return quizHTML();
    case 'chapter': return chapterHTML();
    case 'lessonend': return lessonEndHTML();
    case 'final': return finalHTML();
  }
  return '';
}
function render(keepScroll){
  $('#hud').innerHTML = (S && U.screen!=='title') ? hudHTML() : '';
  var st=$('#stage'); st.classList.toggle('enter',!keepScroll); st.innerHTML = stageHTML();
  if(!keepScroll) window.scrollTo(0,0);
  if(U.screen==='plan') drawForecast();
  var th=$('#themebtn'); if(th) th.innerHTML = ico(isDark()?'sun':'moon');
  var sb=$('#soundbtn'); if(sb) sb.innerHTML = ico(soundOn?'vol':'mute');
  if(S && U.screen!=='title') persist();
}
function isDark(){ var d=document.documentElement.getAttribute('data-theme'); if(d) return d==='dark'; return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches; }

/* ---------- действия ---------- */
var A={
 start:function(){
   var sv=readSave(); if(sv&&sv.S&&!U.confirmNew){ U.confirmNew=true; render(true); return; }
   var nm=($('#pname').value||'').trim()||'Предприниматель'; U.confirmNew=false;
   S=newState(nm); U={screen:'event',phase:'choose',res:null}; sfx('coin'); render();
 },
 continue:function(){ var sv=readSave(); if(sv){ applySave(sv); sfx('click'); render(); } },
 loadcode:function(){ openModal(loadHTML()); },
 doload:function(){ var v=$('#loadcode').value; if(importCode(v)){ closeModal(); render(); toast('Игра загружена'); } else $('#loaderr').textContent='Код не подошёл. Проверь, что скопировал его целиком.'; },
 choose:function(el){
   var i=+el.getAttribute('data-i'), ev=EVENTS[S.month-1];
   var before=S.cash, chips=ev.choices[i].apply(S, Math.random);
   var gap=coverDeficit(S); if(gap) chips.push({t:'Денег не хватило: банк покрыл '+rub(gap)+' в долг',k:'loss'});
   addTerm(ev.term); U.res={i:i,chips:chips}; sfx(S.cash>=before?'good':'bad'); render(true);
   var n=$('.lesson'); if(n) n.scrollIntoView({behavior:'smooth',block:'center'});
 },
 toplan:function(){ prepareMonth(); U.screen='plan'; U.tab='biz'; U.res=null; render(); },
 tab:function(el){ U.tab=el.getAttribute('data-t'); render(true); },
 ad:function(el){ S.adIdx=+el.getAttribute('data-i'); sfx('click'); render(true); },
 buy:function(el){
   var u=UPGRADES.filter(function(x){return x.id===el.getAttribute('data-id');})[0];
   if(S.cash<u.cost||S.up[u.id]) return; S.cash-=u.cost; S.up[u.id]=true;
   var b=bounds(); S.price=clamp(S.price,b.min,b.max); fitProduce();
   if(u.id==='brandkit') S.brand=clamp(S.brand+10,0,100);
   sfx('coin'); toast('Куплено: '+u.name); render(true);
 },
 mv:function(el){
   var k=el.getAttribute('data-k'), d=el.getAttribute('data-d'), amt;
   if(d==='all') amt=Math.max(0,Math.floor(S.cash)); else if(d==='-all') amt=-S[k]; else amt=+d;
   if(amt>0) amt=Math.min(amt,Math.floor(S.cash)); else amt=-Math.min(-amt,S[k]);
   if(!amt) { toast(amt===0&&d.charAt(0)!=='-'?'На счету нет свободных денег':'Здесь нечего забирать'); return; }
   S.cash-=amt; S[k]+=amt; sfx('click'); render(true);
 },
 repay:function(el){
   var d=el.getAttribute('data-d'), amt=d==='all'?S.loanLeft:+d; amt=Math.min(amt,S.loanLeft,Math.floor(S.cash)); if(amt<=0) return;
   S.cash-=amt; S.loanLeft-=amt; if(S.loanLeft<1){S.loanLeft=0;S.loanStep=0;} else S.loanStep=Math.min(S.loanStep,S.loanLeft);
   sfx('coin'); toast('Погашено: '+rub(amt)); render(true);
 },
 go:function(){
   if(planSpend()>S.cash) return;
   var before=S.cash, r=runMonth(S,{price:S.price,produce:S.produce,adIdx:S.adIdx},Math.random);
   r.cashBefore=before; r.cashAfter=S.cash; U.report=r; U.screen='report';
   if(r.profit>0){ sfx('good'); burst(34); } else sfx('bad'); render();
 },
 afterreport:function(){
   var m=U.report.month;
   if(m%4===0){ startQuiz(chapterOf(m)); render(); } else { U.screen='event'; U.res=null; render(); }
 },
 qpick:function(el){
   var Q=U.quiz; if(Q.picked!==null) return; var i=+el.getAttribute('data-i'); Q.picked=i;
   if(Q.qs[Q.i].opts[i].ok){ Q.correct++; sfx('good'); } else sfx('bad'); render(true);
 },
 qnext:function(){
   var Q=U.quiz;
   if(Q.i<Q.qs.length-1){ Q.i++; Q.picked=null; render(); return; }
   var ch=Q.ch, bonus=Q.correct*QUIZ_BONUS, m0=CHAPTERS[ch].months[0], m1=CHAPTERS[ch].months[1];
   S.cash+=bonus; S.quizScore.push(Q.correct); S.quizTotal+=Q.qs.length;
   var prof=S.history.filter(function(x){return x.m>=m0&&x.m<=m1;}).reduce(function(a,x){return a+x.profit;},0);
   U.chapterInfo={ch:ch,correct:Q.correct,bonus:bonus,profit:prof}; U.screen='chapter'; if(Q.correct>=2){ sfx('win'); burst(30); }
   render();
 },
 chapternext:function(){
   var ch=U.chapterInfo.ch;
   if(ch===3){ U.screen='final'; var good=netWorth(S)>=GOAL*0.5; if(good) sfx('win'); render(); if(good) burst(netWorth(S)>=GOAL?160:70); }
   else if(ch===1){ U.screen='lessonend'; render(); }
   else { U.screen='event'; U.res=null; render(); }
 },
 lessonnext:function(){ U.screen='event'; U.res=null; render(); },
 copysave:function(){ copyText($('#savecode').value,'#savecode'); },
 copyres:function(){ copyText($('#resline').value,'#resline'); },
 restart:function(){ U={screen:'title',confirmNew:false}; S=null; render(); },
 glossary:function(){ openModal(glossaryHTML()); },
 closemodal:function(){ closeModal(); },
 theme:function(){ var d=!isDark(); document.documentElement.setAttribute('data-theme',d?'dark':'light'); try{ localStorage.setItem(THEME_KEY,d?'dark':'light'); }catch(e){} render(true); },
 sound:function(){ soundOn=!soundOn; try{ localStorage.setItem('merch-empire-sound',soundOn?'1':'0'); }catch(e){} render(true); sfx('click'); }
};
function copyText(t,sel){
  var done=function(){ toast('Скопировано'); };
  try{ navigator.clipboard.writeText(t).then(done,function(){ var e=$(sel); e.focus(); e.select(); toast('Выдели текст и нажми Ctrl+C'); }); }
  catch(e){ var x=$(sel); x.focus(); x.select(); toast('Выдели текст и нажми Ctrl+C'); }
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  if(el.classList.contains('modal') && e.target!==el) return;
  var a=el.getAttribute('data-act'); if(A[a]){ if(a!=='go'&&a!=='choose'&&a!=='qpick'&&a!=='start') sfx('click'); A[a](el); }
});
document.addEventListener('input',function(e){
  if(!S||U.screen!=='plan') return;
  if(e.target.id==='price'){ S.price=+e.target.value; drawForecast(); }
  else if(e.target.id==='produce'){ S.produce=+e.target.value; drawForecast(); }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); if(e.key==='Enter' && e.target.id==='pname') A.start(); });

/* ---------- запуск ---------- */
function boot(){
  try{ var th=localStorage.getItem(THEME_KEY); if(th) document.documentElement.setAttribute('data-theme',th); soundOn=localStorage.getItem('merch-empire-sound')==='1'; }catch(e){}
  $('#app-tools').innerHTML=
   '<button class="iconbtn" data-act="glossary" title="Словарик" aria-label="Словарик">'+ico('book')+'</button>'+
   '<button class="iconbtn" id="soundbtn" data-act="sound" title="Звук" aria-label="Звук"></button>'+
   '<button class="iconbtn" id="themebtn" data-act="theme" title="Тема" aria-label="Сменить тему"></button>';
  var sv=readSave(); if(sv&&sv.S){ S=newState('x'); S=null; }
  U={screen:'title'}; render();
  window.__game={get S(){return S;},get U(){return U;},A:A,render:render};
}
boot();
})();

</script>

</body>
</html>
